<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d8">
<meta name="description" content="Tojung Bi Kyul — 144 Korean fortune readings in a refined modern minhwa-inspired experience.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#efe6d8}
#fortuneViewport{display:block;width:100%;height:620px;border:0;margin:0;padding:0;background:#efe6d8;overflow:hidden}
@media(max-width:640px){#fortuneViewport{height:1180px}}
</style>
</head>
<body>
<iframe id="fortuneViewport" src="./english-polish.html?v=20260828-fixed620" title="Tojung Bi Kyul — 144 Korean Fortune Readings" loading="eager" scrolling="no"></iframe>
<script>
(function(){
  const frame=document.getElementById('fortuneViewport');
  let resultDone=false;
  function initialHeight(){return window.matchMedia('(max-width:640px)').matches?1180:620}
  function setHeight(h,mode){
    h=Math.max(360,Math.min(24000,Math.ceil(Number(h)||initialHeight())));
    if(mode==='result'){
      if(resultDone)return;
      resultDone=true;
    }else if(resultDone){
      return;
    }
    frame.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    try{parent.postMessage({type:'TOJEONG_EMBED_HEIGHT',height:h,mode},'*')}catch(e){}
  }
  setHeight(initialHeight(),'initial');
  window.addEventListener('message',e=>{
    if(!e.data)return;
    if(e.data.type==='TOJEONG_RESULT_EXPAND')setHeight(e.data.height,'result');
  });
})();
</script>
</body>
</html>
