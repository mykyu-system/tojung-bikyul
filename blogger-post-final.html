<!-- Blogger post HTML: fixed 620px initial height; result expands once via postMessage. -->
<iframe id="tojung-app" src="https://mykyu-system.github.io/tojung-bikyul/english.html?v=20260830-energy-terms1" title="Tojung Bi Kyul" loading="eager" scrolling="no" style="display:block;width:100%;height:620px;min-height:0;max-height:none;border:0;margin:0;padding:0;overflow:hidden;background:#efe6d8"></iframe>
<script>
(function(){
  const frame=document.getElementById('tojung-app');
  let resultDone=false;
  window.addEventListener('message',function(e){
    if(e.origin!=='https://mykyu-system.github.io'||!e.data||e.data.type!=='TOJEONG_EMBED_HEIGHT'||e.data.mode!=='result'||resultDone)return;
    const h=Number(e.data.height);
    if(!Number.isFinite(h))return;
    resultDone=true;
    frame.style.height=Math.max(620,Math.min(24000,Math.ceil(h+2)))+'px';
  });
})();
</script>
