<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#efe6d8}
#fortuneViewport{display:block;width:100%;height:620px;border:0;margin:0;padding:0;background:#efe6d8;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .1s ease}

<body>
<iframe id="fortuneViewport" src="./english-app7.html?v=20260829-hojakdo-live5" title="Tojung Bi Kyul — 144 Korean Fortune Readings" loading="eager" scrolling="no"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('fortuneViewport');
const HOJAKDO='./assets/hojakdo-main-live.webp?v=20260829-live5';
const ZODIAC_POS={Rat:[0,0],Ox:[1,0],Tiger:[2,0],Rabbit:[3,0],Dragon:[0,1],Snake:[1,1],Horse:[2,1],Goat:[3,1],Monkey:[0,2],Rooster:[1,2],Dog:[2,2],Pig:[3,2]};
const ZODIAC_FILES=['./assets/zodiac-user-approved-final.b64.0','./assets/zodiac-user-approved-final.b64.1','./assets/zodiac-user-approved-final.b64.2','./assets/zodiac-user-approved-final.b64.3'];
let ready=false,resultDone=false,settling=false,installing=false,zodiacSpritePromise=null;
function initialHeight(){if(matchMedia('(max-width:640px)').matches)return 1180;if(matchMedia('(max-width:1000px)').matches)return 524;return 620}
function applyHeight(h,mode){h=Math.max(360,Math.min(24000,Math.ceil(Number(h)||initialHeight())));frame.style.height=h+'px';document.documentElement.style.height=h+'px';document.body.style.height=h+'px';try{parent.postMessage({type:'TOJEONG_EMBED_HEIGHT',height:h,mode:mode||'initial'},'*')}catch(e){}}
applyHeight(initialHeight(),'initial');
function childDoc(){try{return frame.contentDocument||null}catch(e){return null}}
function reveal(){if(ready)return;ready=true;requestAnimationFrame(()=>requestAnimationFrame(()=>frame.classList.add('ready')))}
function loadStyle(doc,id,href){return new Promise(resolve=>{let l=doc.getElementById(id);if(l){try{if(l.sheet){resolve();return}}catch(e){}}else{l=doc.createElement('link');l.id=id;l.rel='stylesheet';l.href=href;doc.head.appendChild(l)}l.addEventListener('load',resolve,{once:true});l.addEventListener('error',resolve,{once:true})})}
function buildImageFromChunks(files){return(async()=>{const chunks=[];for(const file of files){const r=await fetch(file+'?v=20260829-live5',{cache:'no-store'});if(!r.ok)throw new Error('zodiac asset failed');chunks.push((await r.text()).replace(/\s+/g,''))}const data=chunks.join('');if(data.length<40000||!data.startsWith('UklG'))throw new Error('zodiac image invalid');const src='data:image/webp;base64,'+data;await new Promise((ok,no)=>{const i=new Image();i.onload=ok;i.onerror=no;i.src=src});return src})()}
function buildZodiac(){if(!zodiacSpritePromise)zodiacSpritePromise=buildImageFromChunks(ZODIAC_FILES);return zodiacSpritePromise}
function installZodiac(doc,sprite){let s=doc.getElementById('tojung-zodiac-user-approved-style');if(!s){s=doc.createElement('style');s.id='tojung-zodiac-user-approved-style';s.textContent='.zodiac-circle{width:145px!important;height:145px!important;margin:4px auto 0!important;border:0!important;border-radius:0!important;overflow:visible!important;background:none!important;box-shadow:none!important;display:grid!important;place-items:center!important}.zodiac-circle:before,.zodiac-circle:after{display:none!important;content:none!important}.zodiac-emoji{width:145px!important;height:145px!important;display:block!important;font-size:0!important;line-height:0!important;color:transparent!important;background-repeat:no-repeat!important;background-color:transparent!important;box-shadow:none!important;filter:none!important}.land-circle,.land-birds{display:none!important}@media(max-width:640px){.zodiac-circle,.zodiac-emoji{width:138px!important;height:138px!important}}';doc.head.appendChild(s)}
const bind=(nameId,targetId)=>{const n=doc.getElementById(nameId),t=doc.getElementById(targetId);if(!n||!t)return;const draw=()=>{const p=ZODIAC_POS[(n.textContent||'').trim()];if(!p)return;t.textContent='';t.innerHTML='';t.style.backgroundImage='url("'+sprite+'")';t.style.backgroundSize='400% 300%';t.style.backgroundPosition=(p[0]*100/3)+'% '+(p[1]*50)+'%';t.style.backgroundRepeat='no-repeat'};draw();new MutationObserver(draw).observe(n,{childList:true,characterData:true,subtree:true})};bind('yearZodiac','yearEmoji');bind('dayZodiac','dayEmoji')}
function fitHojakdo(doc){const img=doc&&doc.getElementById('folkArt');if(!img)return;img.src=HOJAKDO;img.removeAttribute('srcset');img.style.setProperty('object-fit','contain','important');img.style.setProperty('object-position','center center','important');img.style.setProperty('width','100%','important');img.style.setProperty('height','100%','important');img.style.setProperty('background','#d9bf8d','important');if(img.parentElement)img.parentElement.style.setProperty('background','#d9bf8d','important')}
function install(){const doc=childDoc();if(!doc||!doc.head||installing)return !!doc;installing=true;Promise.all([loadStyle(doc,'tojung-flat-final-style','./assets/final-polish-20260828.css?v=11'),loadStyle(doc,'tojung-blogger-compact-style','./assets/blogger-compact-20260828.css?v=5'),buildZodiac()]).then(([, ,sprite])=>{fitHojakdo(doc);installZodiac(doc,sprite);reveal()}).catch(e=>{console.error(e);fitHojakdo(doc);reveal()});setTimeout(reveal,3000);return true}
function settleResult(){if(resultDone||settling)return;settling=true;let count=0,maxH=0;const timer=setInterval(()=>{const doc=childDoc();if(doc){const h=Math.max(doc.body?doc.body.scrollHeight:0,doc.documentElement?doc.documentElement.scrollHeight:0);if(h>maxH)maxH=h}if(++count>=10){clearInterval(timer);settling=false;if(!maxH)return;resultDone=true;try{frame.contentWindow.scrollTo(0,0)}catch(e){}applyHeight(maxH,'result')}},120)}
function checkResult(){const doc=childDoc();if(!doc)return;const d=doc.getElementById('detail');if(d&&d.classList.contains('show'))settleResult()}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>50)clearInterval(t)},60)});
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data&&e.data.type==='TOJEONG_HEIGHT')checkResult()});
window.addEventListener('resize',()=>{if(!resultDone)applyHeight(initialHeight(),'initial')},{passive:true});
})();
</script>
