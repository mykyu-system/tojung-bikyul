name: Patch Blogger Embed Height
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_embed_height.py'
      - '.github/workflows/patch-embed-height.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip embed-height]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply dynamic embed height patch
        run: python scripts/patch_embed_height.py
      - name: Commit patched production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-v4.html english.html blogger-english.html blogger.html
          git diff --cached --quiet || git commit -m 'Fit Blogger embed to content height [skip embed-height]'
          git push
