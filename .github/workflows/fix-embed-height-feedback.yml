name: Fix Embed Height Feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-embed-height-feedback.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch nested iframe height calculation
        run: python scripts/fix_embed_height_feedback.py
      - name: Commit compact dynamic embed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-v4.html english-v2.html blogger-english.html blogger.html
          git diff --cached --quiet || git commit -m 'Fix shrinking iframe height feedback [skip height-feedback]'
          git push
