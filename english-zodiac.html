<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system Personal Fortune</title><style>html,body{margin:0;padding:0;background:#faf9fc}iframe{display:block;width:100%;height:7600px;min-height:7600px;border:0}</style></head><body><iframe id="app" src="./english-app4.html?v=20260827-zodiac" title="Mykyu-system Personal Fortune" loading="eager"></iframe><script>(function(){const animals={Zi:'Rat',Chou:'Ox',Yin:'Tiger',Mao:'Rabbit',Chen:'Dragon',Si:'Snake',Wu:'Horse',Wei:'Goat',Shen:'Monkey',You:'Rooster',Xu:'Dog',Hai:'Pig'};const re=/\b(?:Jia|Yi|Bing|Ding|Wu|Ji|Geng|Xin|Ren|Gui)-(Zi|Chou|Yin|Mao|Chen|Si|Wu|Wei|Shen|You|Xu|Hai)\b/g;function convert(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(re.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(re,(_,branch)=>animals[branch]);re.lastIndex=0;}}}document.getElementById('app').addEventListener('load',function(){const f=this;function run(){try{convert(f.contentDocument.body);new MutationObserver(()=>convert(f.contentDocument.body)).observe(f.contentDocument.body,{subtree:true,childList:true,characterData:true});}catch(e){}}run();setTimeout(run,500);setTimeout(run,1500);});})();</script></body></html>
