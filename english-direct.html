<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu System Personal Fortune</title><style>html,body{margin:0;padding:0;background:#f4f6f8}iframe{display:block;width:100%;min-height:5200px;height:5200px;border:0}</style></head><body><iframe id="app" src="./english-app4.html?v=20260827-labels1" title="Mykyu System Personal Fortune" loading="eager"></iframe><script>(function(){const app=document.getElementById('app');const animals={zi:'Rat',chou:'Ox',yin:'Tiger',mao:'Rabbit',chen:'Dragon',si:'Snake',wu:'Horse',wei:'Goat',shen:'Monkey',you:'Rooster',xu:'Dog',hai:'Pig'};const cycleRe=/\b(?:Jia|Yi|Bing|Ding|Wu|Ji|Geng|Xin|Ren|Gui)-(Zi|Chou|Yin|Mao|Chen|Si|Wu|Wei|Shen|You|Xu|Hai)\b/gi;function animalize(s){return String(s??'').replace(cycleRe,(_,b)=>animals[String(b).toLowerCase()]||b)}function clean(s){let out=animalize(s);out=out.replace(/\bYear cycle\b/gi,'Year Zodiac').replace(/\bMonth cycle\b/gi,'Month Zodiac').replace(/\bBirth-day cycle\b/gi,'Birth-day Zodiac').replace(/\bFinal\s+144\s+Gua\b/gi,'Final Reading').replace(/\bUpper\s+Gua\b/gi,'Upper Trigram').replace(/\bMiddle\s+Gua\b/gi,'Middle Trigram').replace(/\bLower\s+Gua\b/gi,'Lower Trigram').replace(/\bGua\s+Code\b/gi,'Reading Code').replace(/\bGua\s+Name\b/gi,'Reading Name').replace(/\bGua\s+Number\b/gi,'Reading Number').replace(/\b144-Gua calculation system\b/gi,'144-reading system').replace(/\bGua\b/gi,'Reading');return out}let busy=false;function fix(){if(busy)return;busy=true;try{const d=app.contentDocument;if(!d||!d.body)return;const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);for(const node of nodes){const p=node.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA'].includes(p.tagName))continue;const before=node.nodeValue,after=clean(before);if(after!==before)node.nodeValue=after}for(const el of d.querySelectorAll('[title],[aria-label],[placeholder]')){for(const a of ['title','aria-label','placeholder']){if(!el.hasAttribute(a))continue;const before=el.getAttribute(a),after=clean(before);if(after!==before)el.setAttribute(a,after)}}}catch(e){console.error(e)}finally{busy=false}}app.addEventListener('load',()=>{fix();const d=app.contentDocument;if(!d||!d.body)return;let queued=false;const obs=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;fix()})});obs.observe(d.body,{subtree:true,childList:true,characterData:true});const go=d.getElementById('go');if(go)go.addEventListener('click',()=>{setTimeout(fix,50);setTimeout(fix,350);setTimeout(fix,1200)},{passive:true})});})();</script></body></html>
