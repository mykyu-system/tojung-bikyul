<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mykyu-system · 토정비결 100점 완성판</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#6b7280;--line:#e2e5ea;--a:#5b4bd8;--soft:#f1efff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:940px;margin:auto;padding:20px 14px 60px}header{padding:8px 2px 20px}h1{font-size:29px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:17px 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;margin:12px 0;box-shadow:0 3px 14px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}input,button{height:46px;width:100%;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:15px;background:#fff}button{margin-top:12px;background:var(--a);color:#fff;border:0;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#fff;color:var(--text);border:1px solid var(--line)}.tabs button.active{background:var(--soft);color:var(--a);border-color:#d9d3ff}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.badge{display:inline-block;background:var(--soft);color:var(--a);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.score{font-size:42px;font-weight:900}.muted,.note,.foot{color:var(--muted)}p{line-height:1.75;margin:7px 0}.note,.foot{font-size:12px;line-height:1.7;margin-top:10px}table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--line);padding:9px 4px;vertical-align:top}td:first-child{width:31%;color:var(--muted)}.months{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.month{border:1px solid var(--line);border-radius:14px;padding:13px}.bar{height:6px;background:#eee;border-radius:99px;margin:8px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:99px}.hidden{display:none}.error{color:#b33b3b;font-size:13px;margin-top:8px}.pill{display:inline-block;border:1px solid var(--line);padding:5px 8px;border-radius:99px;margin:3px 3px 0 0;font-size:12px}@media(max-width:680px){.grid,.hero,.months{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>Mykyu-system</h1><div class="muted">토정비결 144괘 · 100점 완성판</div></header>
<section class="card"><h2>생년월일 입력</h2>
<div class="tabs"><button id="solarBtn" class="active" onclick="setMode('solar')">양력</button><button id="lunarBtn" onclick="setMode('lunar')">음력</button></div>
<div class="grid" style="margin-top:10px"><div><label>출생 연도</label><input id="by" type="number" min="1900" max="2050" placeholder="예: 1974"></div><div><label>출생 월</label><input id="bm" type="number" min="1" max="12" placeholder="1~12"></div><div><label>출생 일</label><input id="bd" type="number" min="1" max="31" placeholder="1~31"></div></div>
<div id="leapBox" class="hidden" style="margin-top:10px"><label><input id="leap" type="checkbox" style="width:auto;height:auto"> 윤달 생일</label></div>
<div class="grid"><div><label>운세 연도</label><input id="ty" type="number" min="1900" max="2050" value="2026"></div><div></div><div></div></div>
<button onclick="calculate()">토정비결 보기</button><div id="err" class="error"></div>
<div class="note">양력/음력 모두 입력할 수 있습니다. 1900~2050년 지원. 음력 윤달도 선택 가능합니다.</div></section>

<section id="result" class="hidden">
<div class="card hero"><div><span class="badge" id="q"></span><h2 id="qn"></h2><div class="muted" id="meta"></div></div><div><div class="score" id="sc"></div><b id="gr"></b></div></div>
<div class="card"><h2>올해 한 줄</h2><p id="sum"></p><div id="keywords"></div></div>
<div class="card"><h2>개인 맞춤 해석</h2><p id="personal"></p><table id="personalTable"></table></div>
<div class="card"><h2>분야별 운세</h2><div id="fields"></div></div>
<div class="card"><h2>1~12월 운세</h2><div class="months" id="months"></div></div>
<div class="card"><h2>올해의 실전 전략</h2><p id="strategy"></p><div id="strategyTags"></div></div>
<div class="card"><h2>작괘 계산 검증</h2><table id="calcinfo"></table></div>
<div class="card"><h2>최종 판단</h2><p id="fin"></p><table id="last"></table></div>
<div class="foot">토정비결은 전통 운세 문화 콘텐츠입니다. 과학적 예측이 아니므로 의료·법률·투자·계약 등 중요한 결정은 객관적인 자료와 전문가의 판단을 우선하세요.</div>
</section></div>
<script>
let APP=null;
let APP_READY=false;
fetch('./Mykyu-system_TOJEONG_100_FINAL.json',{cache:'no-store'})
 .then(r=>{if(!r.ok) throw new Error('운세 데이터 로드 실패'); return r.json()})
 .then(d=>{APP=d;APP_READY=true})
 .catch(e=>{console.error(e);document.getElementById('err').textContent='운세 데이터를 불러오지 못했습니다. JSON 파일이 같은 폴더에 있는지 확인해주세요.'});
let mode="solar";const S=["갑","을","병","정","무","기","경","신","임","계"],B=["자","축","인","묘","진","사","오","미","신","유","술","해"];
function setMode(m){mode=m;document.getElementById("solarBtn").classList.toggle("active",m==="solar");document.getElementById("lunarBtn").classList.toggle("active",m==="lunar");document.getElementById("leapBox").classList.toggle("hidden",m!=="lunar")}
function yg(y){let i=((y-4)%60+60)%60;return S[i%10]+B[i%12]}function rem(n,k){let r=n%k;return r===0?k:r}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mgj(y,m){let g=yg(y),si=S.indexOf(g[0]);return S[(si*2+m+1)%10]+B[(m+1)%12]}
function joinText(a){return a.filter(Boolean).join(" ")}
function personalText(age,lm,ld,g){
 const cycle=age%3===0?"정리와 회수":age%3===1?"준비와 선택":"실행과 확장";
 const birth=lm<=4?"상반기 초반의 준비":lm<=8?"중반부의 선택":"후반부의 정리";
 return joinText([
  `세는나이 ${age}세의 흐름에서는 ${cycle}을 중심축으로 잡는 것이 좋습니다.`,
  `${birth}이 중요하게 작용합니다.`,
  `전체운은 ${g.summary}`,
  `재물은 ${g.money}`,
  `직업·사업은 ${g.career}`,
  `관계는 ${g.relationship}`,
  `건강은 ${g.health}`,
  g.detailed?.final
 ]);
}
function categoryText(label,base,score){
 const lead={
  "재물운":score>=85?"성과를 실제 수입과 현금흐름으로 연결하는 데 초점을 둡니다.":score>=75?"안정적인 흐름을 유지하면서 불필요한 지출을 줄이는 데 초점을 둡니다.":"확장보다 손실 관리와 현금 보존을 우선하는 흐름입니다.",
  "투자·재테크운":score>=85?"기회 포착은 가능하지만 분할·분산과 수익 실현 기준을 함께 세우는 것이 좋습니다.":score>=75?"공격적인 확대보다 기존 포지션과 위험도를 점검하는 접근이 적합합니다.":"수익보다 변동성 관리와 원금 방어를 우선하는 편이 안전합니다.",
  "직업운":score>=85?"역할 확대나 성과를 보여줄 기회에 적극적으로 대응하는 흐름입니다.":score>=75?"현재 역할을 다듬고 준비된 분야에서 신뢰를 쌓는 흐름입니다.":"급한 변화를 피하고 다음 기회를 위한 실력과 조건을 정리하는 흐름입니다.",
  "사업운":score>=85?"준비된 계획은 실행으로 옮기되 규모 확대는 단계적으로 진행하는 것이 좋습니다.":score>=75?"기존 고객·거래·운영을 안정시키면서 선택적으로 확장하는 편이 좋습니다.":"신규 확장보다 비용·계약·현금흐름을 먼저 점검하는 것이 중요합니다.",
  "이직·취업운":score>=85?"정보가 모이면 적극적으로 지원·협상까지 연결해볼 만한 흐름입니다.":score>=75?"조건 비교와 준비를 끝낸 뒤 움직이는 방식이 유리합니다.":"충동적인 이동보다 이력·조건·일정을 정리한 뒤 움직이는 것이 좋습니다.",
  "승진·시험운":score>=85?"준비한 만큼 결과를 확인하기 쉬운 흐름이므로 실전 대응력을 높이는 것이 좋습니다.":score>=75?"기본기를 유지하면서 부족한 부분을 보완하면 성과를 만들기 좋습니다.":"단기 결과에 조급해하지 말고 반복 학습과 점검에 집중하는 것이 좋습니다.",
  "부동산운":score>=85?"계약과 자금계획을 꼼꼼히 확인한 뒤 좋은 조건을 선별하는 흐름입니다.":score>=75?"가격보다 자금계획·보유비용·계약조건을 함께 비교하는 것이 중요합니다.":"무리한 레버리지보다 현금흐름과 계약 안정성을 우선해야 합니다.",
  "문서·계약운":"조건과 숫자를 직접 확인하고 구두 약속은 문서로 남기는 것이 중요합니다.",
  "애정·가정운":"가까운 사람과의 대화가 흐름을 좌우하므로 작은 오해를 오래 끌지 않는 것이 좋습니다.",
  "부부·결혼운":"상대의 입장을 확인하면서 현실적인 생활·금전 문제를 함께 조율하는 것이 좋습니다.",
  "가족·자녀운":"가족에게 시간을 쓰는 것이 전체적인 안정감과 운의 흐름을 돕습니다.",
  "대인관계·귀인운":"도움을 주고받을 인연은 가까이 두되 소문과 감정적인 말에는 거리를 두는 것이 좋습니다.",
  "구설·갈등운":"말보다 사실과 기록을 기준으로 판단하고 감정적인 대응을 한 번 늦추는 것이 좋습니다.",
  "건강운":"무리한 일정은 줄이고 휴식·수면·생활 리듬을 함께 관리하는 것이 중요합니다.",
  "사고·주의운":"서두르지 않고 기본적인 안전수칙과 일정 확인을 반복하는 것이 좋습니다.",
  "이동·여행운":"목적·비용·일정을 먼저 정리한 뒤 움직이면 변수가 줄어듭니다."
 };
 return `<p><b>${esc(lead[label]||"전체 흐름과 균형을 함께 살피는 것이 좋습니다.")}</b></p><p>${esc(base||"")}</p>`;
}
function monthlyMoney(x,g){
 if(x.score>=90)return `성과를 수입으로 연결하기 좋은 달입니다. ${g.money}`;
 if(x.score>=85)return `기회를 활용하되 지출과 재투자 규모를 함께 관리합니다. ${g.money}`;
 if(x.score>=80)return `수입의 흐름을 유지하면서 선택적인 지출이 어울립니다. ${g.money}`;
 if(x.score>=75)return `큰 확장보다 현금흐름을 안정시키는 것이 우선입니다. ${g.money}`;
 return `보수적으로 자금을 관리하고 불필요한 손실을 줄이는 것이 중요합니다. ${g.money}`;
}
function monthlyWork(x,g){
 if(x.score>=90)return `실행력이 중요한 달입니다. ${g.career}`;
 if(x.score>=85)return `성과를 구체적으로 보여주기 좋은 달입니다. ${g.career}`;
 if(x.score>=80)return `준비와 실행의 균형이 필요한 달입니다. ${g.career}`;
 if(x.score>=75)return `기존 업무를 정리하면서 다음 기회를 준비합니다. ${g.career}`;
 return `속도보다 실수 방지가 중요한 달입니다. ${g.career}`;
}
function monthlyCaution(x,g){
 const h=(x.headline||"").replace(/\.$/,"");
 if(x.score>=90)return `${h}. 성과가 좋을수록 과도한 확대와 자만을 경계합니다.`;
 if(x.score>=85)return `${h}. 계약·지출·약속은 한 번 더 확인합니다.`;
 if(x.score>=80)return `${h}. 급한 결정은 하루 정도 여유를 두고 검토합니다.`;
 if(x.score>=75)return `${h}. 무리한 투자·지출과 감정적인 대응을 줄입니다.`;
 return `${h}. 손실 확대를 막기 위해 보수적으로 움직입니다.`;
}
function calculate(){
if(!APP_READY){document.getElementById("err").textContent="운세 데이터를 불러오는 중입니다. 잠시 후 다시 눌러주세요.";return}
let by=+document.getElementById("by").value,bm=+document.getElementById("bm").value,bd=+document.getElementById("bd").value,ty=+document.getElementById("ty").value,leap=document.getElementById("leap").checked,e=document.getElementById("err");e.textContent="";
if(by<1900||by>2050||bm<1||bm>12||bd<1||ty<1900||ty>2050){e.textContent="1900~2050년 범위와 날짜를 확인해 주세요.";return}
let ly,lm,ld,lf=false;
if(mode==="solar"){let s=`${String(by).padStart(4,"0")}-${String(bm).padStart(2,"0")}-${String(bd).padStart(2,"0")}`,x=APP.calculation.solar_to_lunar[s];if(!x){e.textContent="존재하지 않는 날짜입니다.";return}ly=x.y;lm=x.m;ld=x.d;lf=x.leap}else{if(bd>30){e.textContent="음력 날짜는 1~30일입니다.";return}let s=APP.calculation.lunar_to_solar[`${by}-${bm}-${bd}-${leap?1:0}`];if(!s){e.textContent="존재하지 않는 음력 날짜 또는 윤달입니다.";return}ly=by;lm=bm;ld=bd;lf=leap}
let age=ty-ly+1,tg=yg(ty),row=APP.calculation.jogyeonpyo[tg],md=APP.calculation.month_days[`${ty}-${lm}`],mg=mgj(ty,lm),mrow=APP.calculation.jogyeonpyo[mg];
let targetSolar=APP.calculation.lunar_to_solar[`${ty}-${lm}-${ld}-${lf?1:0}`]||APP.calculation.lunar_to_solar[`${ty}-${lm}-${ld}-0`],dg=APP.calculation.solar_to_lunar[targetSolar]?.dayGanji,drow=APP.calculation.jogyeonpyo[dg];
if(!row||!md||!mrow||!drow){e.textContent="작괘 자료를 찾지 못했습니다.";return}
let u=rem(age+row.태세수,8),m=rem(md+mrow.월건수,6),l=rem(ld+drow.일진수,3),code=`${u}-${m}-${l}`,g=APP.gwae.find(x=>x.code===code);if(!g){e.textContent="144괘 데이터 오류";return}
document.getElementById("result").classList.remove("hidden");document.getElementById("q").textContent=code+"괘";document.getElementById("qn").textContent=g.name;document.getElementById("meta").textContent=`${ty}년 ${tg} · 음력 ${ly}년 ${lm}월 ${ld}일${lf?" (윤달)":""} · 세는나이 ${age}세`;document.getElementById("sc").textContent=g.overall_score+"점";document.getElementById("gr").textContent=g.grade;document.getElementById("sum").textContent=g.summary;document.getElementById("keywords").innerHTML=g.keywords.map(k=>`<span class="pill">${esc(k)}</span>`).join("");document.getElementById("personal").textContent=personalText(age,lm,ld,g);
let fs=[["재물운",g.money],["투자·재테크운",g.detailed?.investment],["직업운",g.career],["사업운",g.detailed?.business||g.career],["이직·취업운",g.detailed?.job_change],["승진·시험운",g.detailed?.promotion_exam],["부동산운",g.detailed?.real_estate],["문서·계약운",g.detailed?.document_contract],["애정·가정운",g.relationship],["부부·결혼운",g.detailed?.marriage||g.relationship],["가족·자녀운",g.detailed?.children_family],["대인관계·귀인운",g.detailed?.social],["구설·갈등운",g.detailed?.conflict||g.detailed?.social],["건강운",g.health],["사고·주의운",g.detailed?.accident],["이동·여행운",g.detailed?.travel_move]];
document.getElementById("fields").innerHTML=fs.map(x=>`<h3>${esc(x[0])}</h3>${categoryText(x[0],x[1],g.overall_score)}`).join("");
document.getElementById("personalTable").innerHTML=[["출생 기준",`${ly}년 음력 ${lm}월 ${ld}일${lf?" 윤달":""}`],["운세 연도",`${ty}년 ${tg}`],["핵심 괘",`${code} · ${g.name}`],["개인화",`나이 ${age} · 생월 ${lm} · 생일 ${ld}`]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("");
let good=[...g.monthly_summary].sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.month+"월").join(", "),bad=[...g.monthly_summary].sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.month+"월").join(", ");
document.getElementById("months").innerHTML=g.monthly_summary.map(x=>`<div class="month"><b>${x.month}월</b><span style="float:right;font-weight:800">${x.score}점</span><div class="bar"><i style="width:${x.score}%"></i></div><p>${esc(x.headline)}</p><p><b>재물:</b> ${esc(monthlyMoney(x,g))}</p><p><b>직업:</b> ${esc(monthlyWork(x,g))}</p><p><b>주의:</b> ${esc(monthlyCaution(x,g))}</p></div>`).join("");
document.getElementById("strategy").textContent=`올해는 ${g.keywords.slice(0,2).join("·")}을 중심으로 움직이고, ${good}에는 실행력을 높이며 ${bad}에는 확인과 정리에 집중하는 전략이 좋습니다.`;document.getElementById("strategyTags").innerHTML=["기회는 분할해서 실행","계약·지출은 재확인","좋은 달에는 성과를 회수","주의 달에는 보수적으로 관리"].map(x=>`<span class="pill">${esc(x)}</span>`).join("");
