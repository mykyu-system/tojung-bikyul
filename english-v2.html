async function buildZodiacSprite(){
 if(spritePromise)return spritePromise;
 spritePromise=(async()=>{const p=[];for(let i=0;i<4;i++){const r=await fetch(`./assets/zodiac12.b64.${i}?v=20260828-premium1`,{cache:'no-store'});if(!r.ok)throw new Error('zodiac art '+i+' failed');p.push((await r.text()).replace(/\s+/g,''))}const s=p.join('');if(s.length!==37780)throw new Error('zodiac art length '+s.length);return'data:image/webp;base64,'+s})();return spritePromise;
}
