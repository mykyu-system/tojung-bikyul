<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system Tojeong</title><style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:100%;min-height:3200px;border:0}</style></head><body><iframe id="app" title="Mykyu-system Tojeong Fortune" loading="eager"></iframe><script>(async()=>{const frame=document.getElementById('app');try{let html=await fetch('./index.html?embed='+Date.now(),{cache:'no-store'}).then(r=>r.text());const patch=`<base href="https://mykyu-system.github.io/tojung-bikyul/"><script>(function(){const nativeFetch=window.fetch.bind(window);function ganji(y){const s=['갑','을','병','정','무','기','경','신','임','계'],b=['자','축','인','묘','진','사','오','미','신','유','술','해'];return s[((y-4)%10+10)%10]+b[((y-4)%12+12)%12]}function dayGanji(y,m,d){const base=Date.UTC(2000,0,7),cur=Date.UTC(y,m-1,d),n=((Math.round((cur-base)/86400000)%60)+60)%60,s=['갑','을','병','정','무','기','경','신','임','계'],b=['자','축','인','묘','진','사','오','미','신','유','술','해'];return s[n%10]+b[n%12]}window.fetch=async function(input,init){const res=await nativeFetch(input,init);const u=typeof input==='string'?input:(input&&input.url)||'';if(!u.includes('Mykyu-system_TOJEONG_100_FINAL.json'))return res;const data=await res.clone().json();const c=data.calculation||{};const j=c.jogyeonpyo||{};for(let y=1900;y<=2050;y++){const k=ganji(y);if(j[k]&&!j[String(y)])j[String(y)]=j[k]}const s2l=c.solar_to_lunar||{};for(const k of Object.keys(s2l)){const v=s2l[k];if(v&&typeof v==='object'&&!v.dayGanji){const p=k.split('-').map(Number);if(p.length===3&&p.every(Number.isFinite))v.dayGanji=dayGanji(p[0],p[1],p[2])}}return new Response(JSON.stringify(data),{status:res.status,headers:{'Content-Type':'application/json'}})};})();<\/script>`;html=html.replace('<head>','<head>'+patch);frame.srcdoc=html}catch(e){document.body.innerHTML='<p style="padding:20px">Unable to load the fortune calculator.</p>'}})();</script></body></html>
