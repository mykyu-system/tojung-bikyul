const ZODIAC_SEALS={Rat:'鼠',Ox:'牛',Tiger:'虎',Rabbit:'兔',Dragon:'龍',Snake:'蛇',Horse:'馬',Goat:'羊',Monkey:'猴',Rooster:'雞',Dog:'狗',Pig:'豬'};
function installZodiacSeals(doc){
  if(doc.documentElement.dataset.zodiacSeals==='1')return;
  doc.documentElement.dataset.zodiacSeals='1';
  const sync=(nameId,targetId)=>{
    const nameEl=doc.getElementById(nameId),target=doc.getElementById(targetId);
    if(!nameEl||!target)return;
    const render=()=>{
      const name=(nameEl.textContent||'').trim();
      const glyph=ZODIAC_SEALS[name]||'福';
      target.textContent='';
      const g=doc.createElement('span');g.className='zodiac-glyph';g.textContent=glyph;
      const l=doc.createElement('span');l.className='zodiac-mini';l.textContent=name||'Zodiac';
      target.append(g,l);
      target.setAttribute('aria-label',(name||'Zodiac')+' traditional animal seal');
    };
    render();
    new MutationObserver(render).observe(nameEl,{childList:true,characterData:true,subtree:true});
  };
  sync('yearZodiac','yearEmoji');
  sync('dayZodiac','dayEmoji');
}
function applyProductionUI(){
  try{
    const doc=app.contentDocument;
    if(!doc)return;
    let style=doc.getElementById('sharp-production-style');
    if(!style){style=doc.createElement('style');style.id='sharp-production-style';style.textContent=SHARP_CSS;doc.head.appendChild(style)}
    installZodiacSeals(doc);
    const fallback=doc.getElementById('artFallback');
    if(fallback)fallback.style.display='none';
    const img=doc.getElementById('folkArt');
    if(img){
      img.style.visibility='visible';
      const target='./assets/hojakdo-app6.webp?v=20260828-zodiacseal1';
      const preload=new Image();
      preload.onload=()=>{img.src=target;img.style.visibility='visible'};
      preload.onerror=()=>{img.style.visibility='visible'};
      preload.src=target;
      if(preload.complete&&preload.naturalWidth){img.src=target}
    }
  }catch(e){console.error('production ui',e)}
}
app.addEventListener('load',applyProductionUI);
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='TOJEONG_HEIGHT')return;app.style.height=Math.max(1000,Math.min(14000,Number(e.data.height)||1900))+'px'});
