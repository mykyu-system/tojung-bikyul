function deep(){
  try{
    const outer=shell.contentDocument;
    const app=outer&&outer.getElementById('app');
    return {outer,app,doc:app&&app.contentDocument};
  }catch(e){return {outer:null,app:null,doc:null}}
}

async function loadSprite(){
  if(spritePromise)return spritePromise;
  spritePromise=(async()=>{
    const parts=[];
    for(let i=0;i<SPRITE_PARTS;i++){
      const r=await fetch(`./assets/zodiac-round-v3.b64.${i}?v=20260828-luxury2`,{cache:'no-store'});
      if(!r.ok)throw new Error('zodiac medallion part '+i+' failed');
      parts.push((await r.text()).replace(/\s+/g,''));
    }
    const joined=parts.join('');
    if(joined.length!==SPRITE_LENGTH)throw new Error('zodiac medallion length mismatch: '+joined.length);
    return 'data:image/webp;base64,'+joined;
  })();
  return spritePromise;
}

function syncHeight(){
  try{
    const outer=shell.contentDocument;
    if(!outer)return;
    const app=outer.getElementById('app');
    const inner=app&&app.contentDocument;
    const h1=Math.max(0,outer.body?.scrollHeight||0,outer.documentElement?.scrollHeight||0);
    const h2=inner?Math.max(inner.body?.scrollHeight||0,inner.documentElement?.scrollHeight||0):0;
    const h=Math.max(900,h1,h2+12);
    shell.style.height=Math.min(14000,h)+'px';
    if(app&&h2)app.style.height=Math.min(14000,h2+4)+'px';
  }catch(e){}
}

function installStyle(doc){

  if(old)old.remove();
  if(doc.getElementById('tojung-luxury-final-style'))return;
  const s=doc.createElement('style');
  s.id='tojung-luxury-final-style';
  s.textContent=FINAL_UI_CSS;
  doc.head.appendChild(s);
  doc.documentElement.setAttribute('data-tojung-ui','luxury-final');
}

function enhanceCopy(doc){
  const art=doc.getElementById('folkArt');
  if(art){
    art.src=HERO_URL;
    art.alt='Traditional Korean minhwa-inspired tiger and magpie artwork for Tojung Bi Kyul';
  }
  const reveal=doc.querySelector('.reveal');
  if(reveal)reveal.setAttribute('aria-label','Reveal my 144-reading Korean fortune');
}

function bindAnimal(doc,sprite,nameId,targetId){
  const nameEl=doc.getElementById(nameId),target=doc.getElementById(targetId);
  if(!nameEl||!target)return;
  const render=()=>requestAnimationFrame(()=>{
    const name=(nameEl.textContent||'').trim();
    const p=POS[name];
    if(!p){target.classList.remove('zodiac-ready');return}
    target.textContent='';
    target.style.backgroundImage=`url("${sprite}")`;
    target.style.backgroundSize='400% 300%';
    target.style.backgroundPosition=`${p[0]*100/3}% ${p[1]*50}%`;
    target.style.backgroundRepeat='no-repeat';
    target.style.backgroundColor='#f6ead7';
    target.classList.add('zodiac-ready');
    target.setAttribute('role','img');
    target.setAttribute('aria-label',name+' traditional Korean zodiac medallion');
  });
  render();
  if(!target.dataset.zodiacObserver){
    target.dataset.zodiacObserver='1';
    new MutationObserver(render).observe(nameEl,{childList:true,characterData:true,subtree:true});
  }
}

function watchResults(doc){
  const detail=doc.querySelector('.detail');
  if(!detail||detail.dataset.finalWatch)return;
  detail.dataset.finalWatch='1';
  new MutationObserver(()=>syncHeight()).observe(detail,{attributes:true,childList:true,subtree:true,characterData:true});
}

async function start(){
  if(started)return;
  const {outer,app,doc}=deep();
  if(!outer||!app||!doc){setTimeout(start,70);return}
  started=true;
  installStyle(doc);
  enhanceCopy(doc);
  watchResults(doc);

  const y=doc.getElementById('yearEmoji'),d=doc.getElementById('dayEmoji');
  if(y)y.classList.remove('zodiac-ready');
  if(d)d.classList.remove('zodiac-ready');

  try{
    const sprite=await loadSprite();
    bindAnimal(doc,sprite,'yearZodiac','yearEmoji');
    bindAnimal(doc,sprite,'dayZodiac','dayEmoji');
  }catch(e){
    console.error('Verified zodiac artwork failed to load',e);
    if(y)y.style.opacity='1';
    if(d)d.style.opacity='1';
  }

  try{
    const ro=new ResizeObserver(syncHeight);
    ro.observe(outer.documentElement);
    if(outer.body)ro.observe(outer.body);
    ro.observe(doc.documentElement);
    if(doc.body)ro.observe(doc.body);
  }catch(e){}
  syncHeight();
  heightTimer=setInterval(syncHeight,700);
}

shell.addEventListener('load',()=>{
  started=false;
  spritePromise=null;
  if(heightTimer){clearInterval(heightTimer);heightTimer=null}
  start();
  syncHeight();
});
window.addEventListener('resize',syncHeight,{passive:true});
window.addEventListener('beforeunload',()=>{if(heightTimer)clearInterval(heightTimer)});
</script>
</body>
</html>
