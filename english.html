function cleanText(el){if(!el)return;let t=el.textContent.trim();if(!hasKR(t))return;if(labels[t]){el.textContent=labels[t];return}const id=el.id||el.parentElement?.id||'';if(id==='err'){el.textContent=fallback('err');return}if(id==='sum'){el.textContent=fallback('sum');return}if(id==='personal'){el.textContent=fallback('personal');return}if(id==='strategy'){el.textContent=fallback('strategy');return}if(id==='fin'){el.textContent=fallback('fin');return}if(el.closest('#fields')){el.textContent=fallback('field');return}if(el.closest('#months')){el.textContent=fallback('month');return}if(id==='qn'||id==='q'){el.textContent=fallback('name');return}if(el.tagName==='OPTION'){el.textContent=el.value==='solar'?'Solar Calendar':el.value==='lunar'?'Lunar Calendar':el.textContent.replace(/[\uAC00-\uD7A3]+/g,'').trim()||'Option';return}el.textContent='Traditional fortune guidance based on your personal calculation.'}
