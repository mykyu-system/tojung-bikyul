<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system 토정비결 100점판</title><style>body{margin:0;background:#f4f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 14px 60px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:29px}h2{margin-top:0}.sub,.note{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:13px;color:#6b7280;display:block;margin-bottom:6px}input,select,button{width:100%;height:46px;border-radius:11px;border:1px solid #e4e7eb;padding:0 12px;font-size:15px;background:#fff}button{background:#5848d8;color:#fff;border:0;font-weight:800;cursor:pointer;margin-top:14px}.hidden{display:none}.hero{display:grid;grid-template-columns:1fr 180px;gap:14px;align-items:center}.badge,.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eeeafd;color:#5848d8;font-size:12px;font-weight:700;margin:2px}.score{font-size:42px;font-weight:900;text-align:center}.grade{text-align:center;font-weight:800}.summary{font-size:17px;line-height:1.8}.table{width:100%;border-collapse:collapse}.table td{border-top:1px solid #e4e7eb;padding:10px 6px}.table td:first-child{color:#6b7280;width:38%}.fields,.monthgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:12px 0;border-top:1px solid #e4e7eb}.field h3{margin:0 0 7px}.field p,.month p{line-height:1.6}.month{border:1px solid #e4e7eb;border-radius:15px;padding:15px}.bar{height:8px;background:#ececec;border-radius:10px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#5848d8}@media(max-width:700px){.grid,.fields,.monthgrid,.hero{grid-template-columns:1fr}.score,.grade{text-align:left}}</style></head><body><div class="wrap"><header><h1>Mykyu-system 토정비결</h1><div class="sub">생년월일과 운세 연도를 바탕으로 전통 작괘 방식과 144괘 데이터를 연결해 개인별 결과를 제공합니다.</div></header><section class="card"><div class="grid"><div><label>입력 방식</label><select id="mode"><option value="solar">양력</option><option value="lunar">음력</option></select></div><div><label>출생년도</label><input id="by" type="number" min="1900" max="2050"></div><div><label>출생월</label><select id="bm"></select></div><div><label>출생일</label><input id="bd" type="number" min="1" max="31"></div><div id="leapWrap" class="hidden"><label>윤달</label><select id="leap"><option value="0">평달</option><option value="1">윤달</option></select></div><div><label>운세 연도</label><input id="ty" type="number" min="1900" max="2050" value="2026"></div></div><button id="go">토정비결 보기</button><div id="err" class="note"></div></section><section id="result" class="hidden"><div class="card hero"><div><span id="q" class="badge"></span><h2 id="qn"></h2><div id="meta" class="sub"></div></div><div><div id="sc" class="score"></div><div id="gr" class="grade"></div></div></div><div class="card"><h2>올해 한 줄</h2><div id="sum" class="summary"></div><div id="keywords"></div></div><div class="card"><h2>개인 맞춤 해석</h2><div id="personal" class="summary"></div><table class="table" id="personalTable"></table></div><div class="card"><h2>분야별 운세</h2><div id="fields" class="fields"></div></div><div class="card"><h2>1~12월 운세</h2><div id="months" class="monthgrid"></div></div><div class="card"><h2>올해의 실전 전략</h2><div id="strategy" class="summary"></div><div id="strategyTags"></div></div><div class="card"><h2>작괘 계산 검증</h2><table class="table" id="calcinfo"></table></div><div class="card"><h2>최종 판단</h2><div id="fin" class="summary"></div><table class="table" id="last"></table></div></section><div class="note">토정비결은 전통 운세 문화 콘텐츠입니다. 과학적 예측이 아니므로 의료·법률·투자·계약 등 중요한 결정은 객관적인 자료와 전문가의 판단을 우선하세요.</div></div><script>
let APP=null;const $=id=>document.getElementById(id),rem=(n,m)=>{let r=n%m;return r===0?m:r},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(let i=1;i<=12;i++)$('bm').insertAdjacentHTML('beforeend',`<option value="${i}">${i}월</option>`);$('mode').onchange=()=>{$('leapWrap').classList.toggle('hidden',$('mode').value!=='lunar');$('bd').max=$('mode').value==='lunar'?30:31};async function load(){let r=await fetch('./Mykyu-system_TOJEONG_100_FINAL.json',{cache:'no-store'});if(!r.ok)throw Error('data');APP=await r.json()}
function yg(y){let a=['갑자','을축','병인','정묘','무진','기사','경오','신미','임신','계유','갑술','을해','병자','정축','무인','기묘','경진','신사','임오','계미','갑신','을유','병술','정해','무자','기축','경인','신묘','임진','계사','甲午','을미','병신','정유','무술','기해','경자','신축','임인','계묘','갑진','을사','병오','정미','무신','기유','경술','신해'];return a[((y-4)%60+60)%60]||''}function monthGanji(y,m){let stem=['갑','을','병','정','무','기','경','신','임','계'],branch=['인','묘','진','사','오','미','신','유','술','해','자','축'],ys=((y-4)%60+60)%60,idx=((ys%10*2+2)+(m-1))%10;return stem[idx]+branch[(m+1)%12]}function personal(age,lm,ld,g){let score=g.overall_score,tone=score>=90?'강한 흐름':score>=80?'안정적인 흐름':score>=70?'관리형 흐름':'주의가 필요한 흐름',k=(g.keywords||[]).slice(0,3).join('·'),action=score>=85?'기회를 실행으로 옮기되 계약·지출은 한 번 더 확인':score>=75?'준비와 실행의 균형을 잡고 작은 성과부터 쌓기':'확장보다 정리·절약·관계 관리에 우선순위를 두기';return `세는나이 ${age}세, 음력 ${lm}월 ${ld}일을 기준으로 ${g.name}의 ${tone}이 겹치는 해입니다. 핵심 키워드 ${k||'균형·준비·기회'}를 중심으로 움직일수록 흐름을 살리기 좋습니다. ${action}.`}function categoryText(name,text,score){if(!text)return '해당 분야의 세부 데이터가 없는 경우 종합 괘의 흐름을 기준으로 해석합니다.';let lead=score>=90?'상승 흐름이 강한 편이다.':score>=80?'기회와 관리가 함께 필요한 흐름이다.':score>=70?'준비와 균형이 중요한 흐름이다.':'무리한 확장보다 위험 관리가 우선이다.';return `<p><b>${lead}</b> ${esc(text)}</p>`}function monthlyMoney(x,g){let s=x.score;if(s>=90)return `성과를 수입으로 연결하기 좋은 달이다. ${g.money||'수입과 지출의 균형을 살핀다.'}`;if(s>=80)return `기회는 있으나 지출 관리가 중요하다. ${g.money||'실속을 우선한다.'}`;if(s>=70)return `큰 승부보다 현금흐름과 실속을 챙긴다. ${g.money||'무리한 지출을 줄인다.'}`;return `보수적으로 관리하고 충동 지출을 피한다. ${g.money||'지출을 먼저 점검한다.'}`}function monthlyWork(x,g){let s=x.score;if(s>=90)return `성과를 전면에 내세우기 좋은 달이다. ${g.career||'준비한 일을 실행한다.'}`;if(s>=80)return `협업과 실행 순서를 잘 잡으면 성과가 난다. ${g.career||'준비된 분야에서 움직인다.'}`;if(s>=70)return `기존 일을 정리하며 다음 기회를 준비한다. ${g.career||'기본기를 챙긴다.'}`;return `변화보다 점검과 실수 방지가 우선이다. ${g.career||'무리하지 않는다.'}`}function monthlyCaution(x,g){let s=x.score;if(s>=90)return '성과가 좋을수록 과욕과 일정 과밀을 피한다.';if(s>=80)return '중요한 약속·계약·지출은 다시 확인한다.';if(s>=70)return '성급한 결정과 불필요한 소비를 줄인다.';return '확장·대출·충동적 결정은 특히 보수적으로 접근한다.'}
async function run(){ $('err').textContent='';try{if(!APP)await load();let mode=$('mode').value,by=+$('by').value,bm=+$('bm').value,bd=+$('bd').value,ty=+$('ty').value,leap=$('leap').value==='1';if(!by||!bm||!bd||!ty){$('err').textContent='모든 항목을 입력해주세요.';return}let ly,lm,ld,lf=false;if(mode==='solar'){let s=`${String(by).padStart(4,'0')}-${String(bm).padStart(2,'0')}-${String(bd).padStart(2,'0')}`,x=APP.calculation.solar_to_lunar[s];if(!x){$('err').textContent='지원하지 않는 날짜입니다.';return}ly=x.y;lm=x.m;ld=x.d;lf=!!x.leap}else{if(bd>30){$('err').textContent='음력 날짜는 1~30일입니다.';return}let s=APP.calculation.lunar_to_solar[`${by}-${bm}-${bd}-${leap?1:0}`];if(!s){$('err').textContent='존재하지 않는 음력 날짜 또는 윤달입니다.';return}ly=by;lm=bm;ld=bd;lf=leap}let age=ty-ly+1,tg=APP.calculation.jogyeonpyo?.[String(ty)]?.간지||yg(ty),row=APP.calculation.jogyeonpyo?.[String(ty)],md=APP.calculation.month_days?.[`${ty}-${lm}`],mg=monthGanji(ty,lm),mrow=APP.calculation.jogyeonpyo?.[mg],targetSolar=APP.calculation.lunar_to_solar?.[`${ty}-${lm}-${ld}-${lf?1:0}`]||APP.calculation.lunar_to_solar?.[`${ty}-${lm}-${ld}-0`],dg=targetSolar?APP.calculation.solar_to_lunar?.[targetSolar]?.dayGanji:'',drow=APP.calculation.jogyeonpyo?.[dg];if(!row||!md||!mrow||!drow){$('err').textContent='작괘 자료를 찾지 못했습니다.';return}let u=rem(age+row.태세수,8),m=rem(md+mrow.월건수,6),l=rem(ld+drow.일진수,3),code=`${u}-${m}-${l}`,g=APP.gwae?.find(x=>x.code===code);if(!g){$('err').textContent='144괘 데이터 오류';return}$('result').classList.remove('hidden');$('q').textContent=code+'괘';$('qn').textContent=g.name;$('meta').textContent=`${ty}년 ${tg} · 음력 ${ly}년 ${lm}월 ${ld}일${lf?' (윤달)':''} · 세는나이 ${age}세`;$('sc').textContent=g.overall_score+'점';$('gr').textContent=g.grade;$('sum').textContent=g.summary;$('keywords').innerHTML=(g.keywords||[]).map(k=>`<span class="pill">${esc(k)}</span>`).join('');$('personal').textContent=personal(age,lm,ld,g);let fs=[['재물운',g.money],['투자·재테크운',g.detailed?.investment],['직업운',g.career],['사업운',g.detailed?.business],['이직·취업운',g.detailed?.job_change],['승진·시험운',g.detailed?.promotion_exam],['부동산운',g.detailed?.real_estate],['문서·계약운',g.detailed?.document_contract],['애정·가정운',g.relationship],['부부·결혼운',g.detailed?.marriage],['가족·자녀운',g.detailed?.children_family],['대인관계·귀인운',g.detailed?.social],['구설·갈등운',g.detailed?.conflict],['건강운',g.health],['사고·주의운',g.detailed?.accident],['이동·여행운',g.detailed?.travel_move]];$('fields').innerHTML=fs.map(x=>`<div class="field"><h3>${esc(x[0])}</h3>${categoryText(x[0],x[1],g.overall_score)}</div>`).join('');$('personalTable').innerHTML=[['출생 기준',`${ly}년 음력 ${lm}월 ${ld}일${lf?' 윤달':''}`],['운세 연도',`${ty}년 ${tg}`],['핵심 괘',`${code} · ${g.name}`],['개인화',`나이 ${age} · 생월 ${lm} · 생일 ${ld}`]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('');let months=Array.isArray(g.monthly_summary)?g.monthly_summary:[],good=[...months].sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.month+'월').join(', '),bad=[...months].sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.month+'월').join(', ');$('months').innerHTML=months.map(x=>`<div class="month"><b>${x.month}월</b><span style="float:right;font-weight:800">${x.score}점</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,x.score))}%"></i></div><p>${esc(x.headline)}</p><p><b>재물:</b> ${esc(monthlyMoney(x,g))}</p><p><b>직업:</b> ${esc(monthlyWork(x,g))}</p><p><b>주의:</b> ${esc(monthlyCaution(x,g))}</p></div>`).join('');$('strategy').textContent=`${good}은 성과를 적극적으로 회수하고, ${bad}은 확인·정리·현금흐름 관리에 집중하는 편이 좋습니다. ${g.summary||''}`;$('strategyTags').innerHTML=['기회는 분할 실행','계약·지출 재확인','성과는 좋은 달에 회수','주의 달은 보수적으로 관리'].map(x=>`<span class="pill">${x}</span>`).join('');$('calcinfo').innerHTML=[['당년 간지',tg],['태세수',row.태세수],['당년 생월 날수',md+'일'],['월건',mg+' → '+mrow.월건수],['당년 생일 일진',dg+' → '+drow.일진수],['상괘',`(${age}+${row.태세수}) ÷ 8 → ${u}`],['중괘',`(${md}+${mrow.월건수}) ÷ 6 → ${m}`],['하괘',`(${ld}+${drow.일진수}) ÷ 3 → ${l}`],['최종 144괘',code]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('');$('fin').textContent=g.detailed?.final||g.summary;$('last').innerHTML=[['종합점수',g.overall_score+'점'],['등급',g.grade],['길한 달',good],['주의 달',bad],['핵심 키워드',(g.keywords||[]).join(' · ')]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('');$('result').scrollIntoView({behavior:'smooth'})}catch(e){console.error(e);$('err').textContent='데이터를 불러오거나 계산하는 중 오류가 발생했습니다. 페이지를 새로고침해 다시 시도해주세요.'}}$('go').onclick=run;</script></body></html>
