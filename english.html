<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d8">
<meta name="description" content="Tojung Bi Kyul — 144 Korean fortune readings in a refined modern minhwa-inspired experience.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow:hidden;background:#efe6d8}
#fortuneViewport{display:block;width:100%;height:780px;border:0;margin:0;padding:0;background:#efe6d8;overflow:hidden}
</style>
</head>
<body>
<iframe id="fortuneViewport" src="./english-polish.html?v=20260828-freeze1" title="Tojung Bi Kyul — 144 Korean Fortune Readings" loading="eager" scrolling="no"></iframe>
<script>
(function(){
  const frame=document.getElementById('fortuneViewport');
  let lockedHeight=0;

  function clampHeight(v){return Math.max(700,Math.min(6000,Math.ceil(Number(v)||780)))}

  function applyHeight(v){
    const h=clampHeight(v);
    lockedHeight=h;
    frame.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    try{parent.postMessage({type:'TOJEONG_EMBED_HEIGHT',height:h,fixed:true},'*')}catch(e){}
  }

  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='TOJEONG_INITIAL_HEIGHT')return;
    applyHeight(e.data.height);
  });

  function fallback(){if(!lockedHeight)applyHeight(window.matchMedia('(max-width:640px)').matches?1200:1240)}

  window.addEventListener('load',()=>setTimeout(fallback,1600));
  setTimeout(fallback,2200);
})();
</script>
</body>
</html>
