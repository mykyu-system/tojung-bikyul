<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mykyu System — Personal Fortune</title>
<style>html,body{margin:0;background:#f3ecdf}iframe{display:block;width:100%;height:100vh;min-height:980px;border:0}</style>
</head>
<body>
<iframe id="shell" src="./english-zodiac.html?v=20260827-zodiacanimals1" title="Mykyu System Personal Fortune" loading="eager"></iframe>
<script>
const shell=document.getElementById('shell');
const animals={Zi:'Rat',Chou:'Ox',Yin:'Tiger',Mao:'Rabbit',Chen:'Dragon',Si:'Snake',Wu:'Horse',Wei:'Goat',Shen:'Monkey',You:'Rooster',Xu:'Dog',Hai:'Pig'};
const cycleRe=/\b(?:Jia|Yi|Bing|Ding|Wu|Ji|Geng|Xin|Ren|Gui)-(Zi|Chou|Yin|Mao|Chen|Si|Wu|Wei|Shen|You|Xu|Hai)\b/gi;
function clean(s){if(!s)return s;return s.replace(cycleRe,(_,branch)=>animals[branch]||branch).replace(/Upper\s+Gua/gi,'Upper Trigram').replace(/Middle\s+Gua/gi,'Middle Trigram').replace(/Lower\s+Gua/gi,'Lower Trigram').replace(/Final\s+144\s+Gua/gi,'Final Reading').replace(/Final\s+Gua/gi,'Final Reading').replace(/Gua\s+Code/gi,'Reading Code').replace(/Gua\s+Name/gi,'Reading Name').replace(/Gua\s+Number/gi,'Reading Number').replace(/Gua\s+Result/gi,'Reading Result').replace(/Gua\s+Details/gi,'Reading Details').replace(/Gua\s+Interpretation/gi,'Reading Interpretation').replace(/Gua\s+Meaning/gi,'Reading Meaning').replace(/Gua\s+Type/gi,'Reading Type').replace(/Gua\s+Title/gi,'Reading Title').replace(/Gua\s+Index/gi,'Reading Index').replace(/\bGua\b/gi,'Reading');}
function cleanDoc(d){if(!d||!d.body)return;const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=w.nextNode())nodes.push(n);for(const node of nodes){if(!node.parentElement||['SCRIPT','STYLE','TEXTAREA'].includes(node.parentElement.tagName))continue;const out=clean(node.nodeValue);if(out!==node.nodeValue)node.nodeValue=out;}d.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>['title','aria-label','placeholder'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,clean(el.getAttribute(a)))}));}
function sweep(){try{const d1=shell.contentDocument;if(!d1)return;cleanDoc(d1);const inner=d1.querySelector('iframe');if(inner&&inner.contentDocument){const d2=inner.contentDocument;cleanDoc(d2);if(!inner.__zobs&&d2.body){inner.__zobs=new MutationObserver(()=>cleanDoc(d2));inner.__zobs.observe(d2.body,{subtree:true,childList:true,characterData:true});}}}catch(e){}}
shell.addEventListener('load',()=>{sweep();setTimeout(sweep,300);setTimeout(sweep,1200);setTimeout(sweep,3000)});setInterval(sweep,600);
</script>
</body>
</html>
