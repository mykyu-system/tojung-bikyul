name: Apply user Hojakdo binary

on:
  push:
    branches: [main]
    paths:
      - 'assets/hojakdo-user-20260829.b64.*'
      - '.github/workflows/apply-user-hojakdo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode uploaded Hojakdo into the real image asset
        shell: bash
        run: |
          cat assets/hojakdo-user-20260829.b64.0 assets/hojakdo-user-20260829.b64.1 \
            | tr -d '\n\r\t ' \
            | base64 --decode > assets/mockup-left.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/mockup-left.webp')
          data = p.read_bytes()
          assert len(data) > 20000, len(data)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', data[:12]
          print('validated', len(data), 'bytes')
          PY
      - name: Commit the real WebP asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mockup-left.webp
          if git diff --cached --quiet; then
            echo 'No image change needed.'
            exit 0
          fi
          git commit -m 'Apply uploaded Hojakdo as mockup-left.webp'
          git push
