<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow:hidden;background:#efe6d8}
#stage{display:block;width:100%;height:980px;border:0;background:#efe6d8;overflow:hidden}
</style>
</head>
<body>
<iframe id="stage" src="./english-v4.html?v=20260828-state2" title="Tojung Bi Kyul" scrolling="no"></iframe>
<script>
(function(){
  const stage=document.getElementById('stage');
  let mode='initial';
  let initialHeight=0;
  let observer=null;
  let initialTimer=null;

  function deep(){
    try{
      const outer=stage.contentDocument;
      const shell=outer&&outer.getElementById('shell');
      const middle=shell&&shell.contentDocument;
      const app=middle&&middle.getElementById('app');
      const doc=app&&app.contentDocument;
      if(!outer||!shell||!middle||!app||!doc)return null;
      return {outer,shell,middle,app,doc};
    }catch(e){return null}
  }

  function style(doc,id,css){
    let el=doc.getElementById(id);
    if(!el){el=doc.createElement('style');el.id=id;doc.head.appendChild(el)}
    el.textContent=css;
  }

  function setLayerHeights(refs,h){
    h=Math.max(720,Math.min(20000,Math.ceil(h)));
    style(refs.outer,'tojung-state-shell',`html,body{overflow:hidden!important}#shell{height:${h}px!important;min-height:${h}px!important;max-height:${h}px!important;overflow:hidden!important}`);
    style(refs.middle,'tojung-state-app',`html,body{overflow:hidden!important}#app{height:${h}px!important;min-height:${h}px!important;max-height:${h}px!important;overflow:hidden!important}`);
    stage.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    stage.setAttribute('scrolling','no');
    refs.shell.setAttribute('scrolling','no');
    refs.app.setAttribute('scrolling','no');
    try{
      refs.doc.documentElement.style.overflow='hidden';
      refs.doc.body.style.overflow='hidden';
    }catch(e){}
    return h;
  }

  function announce(type,h){
    try{parent.postMessage({type,height:h,mode:mode},'*')}catch(e){}
  }

  function contentBottom(doc){
    const result=doc.getElementById('result');
    if(!result)return 0;
    const r=result.getBoundingClientRect();
    const y=doc.defaultView?doc.defaultView.scrollY:0;
    const app=doc.querySelector('.app');
    let pad=16;
    try{if(app)pad=parseFloat(doc.defaultView.getComputedStyle(app).paddingBottom)||16}catch(e){}
    return Math.ceil(r.bottom+y+pad+4);
  }

  function resultBottom(doc){
    const result=doc.getElementById('result');
    const detail=doc.getElementById('detail');
    const target=(detail&&detail.classList.contains('show'))?result:null;
    if(!target)return 0;
    const r=target.getBoundingClientRect();
    const y=doc.defaultView?doc.defaultView.scrollY:0;
    const app=doc.querySelector('.app');
    let pad=20;
    try{if(app)pad=parseFloat(doc.defaultView.getComputedStyle(app).paddingBottom)||20}catch(e){}
    return Math.ceil(r.bottom+y+pad+8);
  }

  function lockInitial(refs){
    if(mode!=='initial'||initialHeight)return;
    const h=contentBottom(refs.doc);
    if(!h)return;
    initialHeight=setLayerHeights(refs,h);
    announce('TOJEONG_INITIAL_LOCK',initialHeight);
  }

  function scheduleInitial(refs){
    if(initialTimer)clearTimeout(initialTimer);
    initialTimer=setTimeout(()=>{
      const r=deep();
      if(!r||mode!=='initial'||initialHeight)return;
      lockInitial(r);
    },420);
  }

  function expandResult(refs){
    if(mode==='result')return;
    mode='result';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const current=deep();
      if(!current)return;
      const h=resultBottom(current.doc);
      if(!h)return;
      const finalH=setLayerHeights(current,h);
      announce('TOJEONG_RESULT_EXPAND',finalH);
      setTimeout(()=>{
        const again=deep();
        if(!again)return;
        const h2=resultBottom(again.doc);
        if(h2>finalH+4){
          const final2=setLayerHeights(again,h2);
          announce('TOJEONG_RESULT_EXPAND',final2);
        }
      },180);
    }));
  }

  function watch(refs){
    if(observer)observer.disconnect();
    const detail=refs.doc.getElementById('detail');
    if(!detail)return;
    observer=new MutationObserver(()=>{
      const r=deep();
      if(r&&detail.classList.contains('show'))expandResult(r);
    });
    observer.observe(detail,{attributes:true,attributeFilter:['class']});
  }

  function apply(){
    const refs=deep();
    if(!refs)return false;
    let link=refs.doc.getElementById('tojung-final-polish-link');
    if(!link){
      link=refs.doc.createElement('link');
      link.id='tojung-final-polish-link';
      link.rel='stylesheet';
      link.href='./assets/final-polish-20260828.css?v=3';
      refs.doc.head.appendChild(link);
      link.addEventListener('load',()=>scheduleInitial(deep()),{once:true});
    }
    watch(refs);
    scheduleInitial(refs);
    return true;
  }

  function retry(){
    let n=0;
    const t=setInterval(()=>{
      n++;
      if(apply()||n>60)clearInterval(t);
    },100);
  }

  stage.addEventListener('load',retry);
  retry();
})();
</script>
</body>
</html>
