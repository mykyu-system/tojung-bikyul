<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe6d8}#stage{display:block;width:100%;height:100%;border:0;background:#efe6d8}</style>

<body>
<iframe id="stage" src="./english-v4.html?v=20260828-polish5" title="Tojung Bi Kyul" scrolling="yes"></iframe>
<script>
(function(){
  const stage=document.getElementById('stage');
  function apply(){
    try{
      const outer=stage.contentDocument;
      const shell=outer&&outer.getElementById('shell');
      const middle=shell&&shell.contentDocument;
      const app=middle&&middle.getElementById('app');
      const doc=app&&app.contentDocument;
      if(!doc)return false;
      if(!doc.getElementById('tojung-final-polish-link')){
        const link=doc.createElement('link');
        link.id='tojung-final-polish-link';
        link.rel='stylesheet';
        link.href='./assets/final-polish-20260828.css?v=2';
        doc.head.appendChild(link);
      }
      return true;
    }catch(e){return false}
  }
  function retry(){let n=0;const t=setInterval(function(){n++;if(apply()||n>50)clearInterval(t)},100)}
  stage.addEventListener('load',retry);
  retry();
})();
</script>
</body>
</html>
