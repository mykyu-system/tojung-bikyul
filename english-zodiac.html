s*Theme)+/gi,'Key Theme');s=s.replace(/\bGua\s*Code\b/gi,'Reading Code');s=s.replace(/\b(Upper|Middle|Lower)\s+Gua\b/gi,(_,p)=>p+' Trigram');s=s.replace(/\bFinal\s+144\s+Gua\b/gi,'Final Reading');s=s.replace(/\bGua\s*(Name|Number|No\.?|Result|Details|Interpretation|Meaning|Type|Title|Index)\b/gi,(_,word)=>'Reading '+({Name:'Name',Number:'Number',No:'Number',Result:'Result',Details:'Details',Interpretation:'Interpretation',Meaning:'Meaning',Type:'Type',Title:'Title',Index:'Index'}[word]||word));s=s.replace(/\bGua\b/gi,'Reading');return s;}function convert(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){const old=n.nodeValue,newv=cleanText(old);if(newv!==old)n.nodeValue=newv;}}function decorate(doc){if(!doc||!doc.head||!doc.body)return;if(!doc.getElementById('mykyu-ui1')){const st=doc.createElement('style');st.id='mykyu-ui1';st.textContent=css;doc.head.appendChild(st)}if(!doc.querySelector('.mykyu-tiger')){const d=doc.createElement('div');d.className='mykyu-tiger';d.innerHTML='<svg viewBox="0 0 420 420" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3768"/><stop offset="1" stop-color="#b58a3a"/></linearGradient></defs><path d="M80 112L55 48l72 35c27-16 113-16 140 0l72-35-25 64c30 29 47 69 47 113 0 86-73 150-166 150S29 311 29 225c0-44 19-84 51-113Z" fill="url(#tg)" opacity=".65"/><path d="M108 177c12-40 47-67 102-67s90 27 102 67c-7 93-46 139-102 139s-95-46-102-139Z" fill="#f7f1e8" opacity=".82"/><ellipse cx="163" cy="192" rx="10" ry="14" fill="#2b2140"/><ellipse cx="257" cy="192" rx="10" ry="14" fill="#2b2140"/><path d="M177 250q43 30 86 0M208 230q2 18 12 0" fill="none" stroke="#2b2140" stroke-width="7" stroke-linecap="round"/><path d="M115 150l44 25M305 150l-44 25M96 215l57 10M324 215l-57 10M123 282l50-25M297 282l-50-25" stroke="#2b2140" stroke-width="12" stroke-linecap="round" opacity=".7"/>
