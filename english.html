<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d8">
<meta name="description" content="Tojung Bi Kyul — 144 Korean fortune readings in a refined modern minhwa-inspired experience.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#efe6d8}
#fortuneViewport{display:block;width:100%;height:980px;border:0;margin:0;padding:0;background:#efe6d8;overflow:hidden}
</style>
</head>
<body>
<iframe id="fortuneViewport" src="./english-polish.html?v=20260828-state2" title="Tojung Bi Kyul — 144 Korean Fortune Readings" loading="eager" scrolling="no"></iframe>
<script>
(function(){
  const frame=document.getElementById('fortuneViewport');
  let mode='initial';
  let initialLocked=false;

  function setHeight(v,nextMode){
    const max=nextMode==='result'?20000:6000;
    const h=Math.max(720,Math.min(max,Math.ceil(Number(v)||980)));
    if(nextMode==='initial'&&initialLocked)return;
    mode=nextMode;
    if(nextMode==='initial')initialLocked=true;
    frame.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    try{parent.postMessage({type:'TOJEONG_EMBED_HEIGHT',height:h,mode:nextMode},'*')}catch(e){}
  }

  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type==='TOJEONG_INITIAL_LOCK')setHeight(e.data.height,'initial');
    if(e.data.type==='TOJEONG_RESULT_EXPAND')setHeight(e.data.height,'result');
  });

  setTimeout(()=>{
    if(!initialLocked)setHeight(window.matchMedia('(max-width:640px)').matches?1180:980,'initial');
  },1800);
})();
</script>
</body>
</html>
