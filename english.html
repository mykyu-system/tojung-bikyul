<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d8">
<meta name="description" content="Tojung Bi Kyul — 144 Korean fortune readings in a refined modern minhwa-inspired experience.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#efe6d8}
#fortuneViewport{display:block;width:100%;height:620px;border:0;margin:0;padding:0;background:#efe6d8;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .1s ease}
#fortuneViewport.ready{visibility:visible;opacity:1}
@media(max-width:1000px) and (min-width:641px){#fortuneViewport{height:524px}}
@media(max-width:640px){#fortuneViewport{height:1180px}}
</style>
</head>
<body>
<iframe id="fortuneViewport" src="./english-app7.html?v=20260828-flat5" title="Tojung Bi Kyul — 144 Korean Fortune Readings" loading="eager" scrolling="no"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('fortuneViewport');
  const ZODIAC_POS={Rat:[0,0],Ox:[1,0],Tiger:[2,0],Rabbit:[3,0],Dragon:[0,1],Snake:[1,1],Horse:[2,1],Goat:[3,1],Monkey:[0,2],Rooster:[1,2],Dog:[2,2],Pig:[3,2]};
  let ready=false;
  let resultDone=false;
  let settling=false;
  let installing=false;
  let zodiacSpritePromise=null;

  function initialHeight(){
    if(window.matchMedia('(max-width:640px)').matches)return 1180;
    if(window.matchMedia('(max-width:1000px)').matches)return 524;
    return 620;
  }

  function applyHeight(h,mode){
    h=Math.max(360,Math.min(24000,Math.ceil(Number(h)||initialHeight())));
    frame.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    try{parent.postMessage({type:'TOJEONG_EMBED_HEIGHT',height:h,mode:mode||'initial'},'*')}catch(e){}
  }

  applyHeight(initialHeight(),'initial');

  function childDoc(){
    try{return frame.contentDocument||null}catch(e){return null}
  }

  function revealFinalUI(){
    if(ready)return;
    ready=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>frame.classList.add('ready')));
  }

  function loadStyle(doc,id,href){
    return new Promise(resolve=>{
      let link=doc.getElementById(id);
      if(link){
        try{if(link.sheet){resolve();return}}catch(e){}
      }else{
        link=doc.createElement('link');
        link.id=id;
        link.rel='stylesheet';
        link.href=href;
        doc.head.appendChild(link);
      }
      link.addEventListener('load',resolve,{once:true});
      link.addEventListener('error',resolve,{once:true});
    });
  }

  function buildZodiacSpriteV3(){
    if(zodiacSpritePromise)return zodiacSpritePromise;
    zodiacSpritePromise=(async()=>{
      const chunks=[];
      for(let i=0;i<5;i++){
        const r=await fetch(`./assets/zodiac-round-v3.b64.${i}?v=20260828-zodiac-v3`,{cache:'no-store'});
        if(!r.ok)throw new Error('zodiac v3 asset '+i+' failed');
        chunks.push((await r.text()).replace(/\s+/g,''));
      }
      const data=chunks.join('');
      if(data.length<40000)throw new Error('zodiac v3 asset incomplete');
      return 'data:image/webp;base64,'+data;
    })();
    return zodiacSpritePromise;
  }

  function installZodiacV3(doc,sprite){
    if(!doc||!sprite)return;
    let style=doc.getElementById('tojung-zodiac-v3-style');
    if(!style){
      style=doc.createElement('style');
      style.id='tojung-zodiac-v3-style';
      style.textContent=`
        .zodiac-emoji{
          width:126px!important;
          height:126px!important;
          display:block!important;
          position:relative!important;
          z-index:2!important;
          border-radius:50%!important;
          overflow:hidden!important;
          font-size:0!important;
          background-repeat:no-repeat!important;
          background-color:#f6ead5!important;
          box-shadow:0 2px 8px rgba(47,34,38,.06)!important;
        }
        @media(max-width:640px){.zodiac-emoji{width:118px!important;height:118px!important}}
      `;
      doc.head.appendChild(style);
    }

    const bind=(nameId,targetId)=>{
      const nameEl=doc.getElementById(nameId);
      const target=doc.getElementById(targetId);
      if(!nameEl||!target)return;
      const render=()=>{
        const name=(nameEl.textContent||'').trim();
        const pos=ZODIAC_POS[name];
        if(!pos)return;
        target.textContent='';
        target.style.backgroundImage=`url(${sprite})`;
        target.style.backgroundSize='400% 300%';
        target.style.backgroundPosition=`${pos[0]*100/3}% ${pos[1]*50}%`;
        target.style.backgroundRepeat='no-repeat';
        target.setAttribute('aria-label',name+' Korean minhwa zodiac illustration');
      };
      render();
      new MutationObserver(render).observe(nameEl,{childList:true,characterData:true,subtree:true});
    };

    bind('yearZodiac','yearEmoji');
    bind('dayZodiac','dayEmoji');
  }

  function installFinalStyle(){
    const doc=childDoc();
    if(!doc||!doc.head||installing)return !!doc;
    installing=true;

    Promise.resolve()
      .then(()=>loadStyle(doc,'tojung-flat-final-style','./assets/final-polish-20260828.css?v=10'))
      .then(()=>loadStyle(doc,'tojung-blogger-compact-style','./assets/blogger-compact-20260828.css?v=4'))
      .then(()=>buildZodiacSpriteV3().catch(e=>{console.error('zodiac v3',e);return null}))
      .then(sprite=>{
        const img=doc.getElementById('folkArt');
        if(img){
          img.src='./assets/mockup-left.webp?v=20260828-flat4';
          img.style.objectFit=window.matchMedia('(max-width:640px)').matches?'contain':'cover';
          img.style.objectPosition=window.matchMedia('(max-width:640px)').matches?'center top':'left center';
        }
        if(sprite)installZodiacV3(doc,sprite);
        revealFinalUI();
      });

    setTimeout(revealFinalUI,3000);
    return true;
  }

  function settleResultHeight(){
    if(resultDone||settling)return;
    settling=true;
    let count=0,maxH=0;
    const timer=setInterval(()=>{
      const doc=childDoc();
      if(doc){
        const h=Math.max(doc.body?doc.body.scrollHeight:0,doc.documentElement?doc.documentElement.scrollHeight:0);
        if(h>maxH)maxH=h;
      }
      count++;
      if(count>=10){
        clearInterval(timer);
        settling=false;
        if(!maxH)return;
        resultDone=true;
        try{frame.contentWindow.scrollTo(0,0)}catch(e){}
        applyHeight(maxH,'result');
      }
    },120);
  }

  function checkResult(){
    const doc=childDoc();
    if(!doc)return;
    const detail=doc.getElementById('detail');
    if(detail&&detail.classList.contains('show'))settleResultHeight();
  }

  frame.addEventListener('load',()=>{
    let tries=0;
    const timer=setInterval(()=>{
      tries++;
      if(installFinalStyle()||tries>40)clearInterval(timer);
    },50);
  });

  window.addEventListener('message',e=>{
    if(e.source!==frame.contentWindow||!e.data)return;
    if(e.data.type==='TOJEONG_HEIGHT')checkResult();
  });

  window.addEventListener('resize',()=>{
    if(resultDone)return;
    applyHeight(initialHeight(),'initial');
  },{passive:true});
})();
</script>
</body>
</html>
