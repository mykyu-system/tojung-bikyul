const css=`
:root{--ink:#201b2c;--purple:#2b2140;--purple2:#46345f;--gold:#b58a3a;--gold2:#d5b36b;--paper:#fbf6ec;--paper2:#f5ecde;--line:#d9cbb7;--muted:#756d72}

.wrap{max-width:1120px!important;margin:0 auto!important;padding:42px 48px 90px 238px!important;position:relative!important}
header{padding:18px 0 34px!important;border:0!important;position:relative!important;z-index:3!important}header:before{content:'YOUR READING RESULT';display:block;color:var(--purple2);font-size:13px;font-weight:700;letter-spacing:.16em;margin-bottom:20px}header h1{font-family:Georgia,"Times New Roman",serif!important;color:var(--purple)!important;font-size:58px!important;line-height:.98!important;font-weight:500!important;letter-spacing:.015em!important;max-width:720px!important;margin:0 0 20px!important}header .sub{font-size:16px!important;line-height:1.75!important;max-width:610px!important;color:#4f4850!important}
.card{background:rgba(255,251,244,.91)!important;border:1px solid var(--line)!important;border-radius:10px!important;box-shadow:0 10px 28px rgba(51,38,31,.07)!important;padding:30px!important;margin:22px 0!important;position:relative!important;z-index:2!important}.card h2{font-family:Georgia,"Times New Roman",serif!important;color:var(--purple)!important;font-weight:500!important;font-size:26px!important;letter-spacing:.01em!important}.note{color:var(--muted)!important;line-height:1.65!important}
.grid{grid-template-columns:repeat(3,1fr)!important;gap:18px!important}label{color:#625a60!important;font-size:12px!important;font-weight:700!important;letter-spacing:.08em!important;text-transform:uppercase!important}input,select{height:48px!important;border:1px solid #d8cbb9!important;border-radius:5px!important;background:#fffdf8!important;color:var(--ink)!important}button{height:48px!important;background:var(--purple)!important;border-radius:5px!important;letter-spacing:.05em!important;font-weight:700!important;box-shadow:0 8px 18px rgba(43,33,64,.16)!important}button:hover{background:#3b2c53!important}
.hero{min-height:230px!important;display:grid!important;grid-template-columns:1fr 180px!important;align-items:center!important;background:linear-gradient(115deg,rgba(255,252,246,.98),rgba(242,230,213,.94))!important;border-color:#d8c8b1!important;overflow:hidden!important}.hero:after{content:'虎';position:absolute;right:34px;top:-48px;font-family:serif;font-size:270px;color:rgba(43,33,64,.045);pointer-events:none}.badge,.pill{background:#eee3d1!important;color:#735522!important;border:1px solid #dbc79e!important;border-radius:3px!important;text-transform:uppercase!important;letter-spacing:.1em!important}.hero h2{font-family:Georgia,"Times New Roman",serif!important;font-size:38px!important;font-weight:500!important;color:var(--purple)!important}.score{font-family:Georgia,"Times New Roman",serif!important;font-size:48px!important;color:var(--purple)!important}.grade{color:#85632a!important;text-transform:uppercase!important;letter-spacing:.1em!important}

#keywords:before{content:'KEY THEME';display:block;color:#a57b2e;font-size:11px;font-weight:800;letter-spacing:.16em;margin-bottom:8px}#keywords .pill{font-size:14px!important;padding:9px 13px!important;background:var(--purple)!important;color:#fffaf1!important;border:0!important}
.fields{grid-template-columns:repeat(5,1fr)!important;gap:0!important}.field{padding:18px 16px!important;border-top:0!important;border-left:1px solid var(--line)!important;text-align:center!important}.field:first-child{border-left:0!important}.field h3{font-family:Georgia,"Times New Roman",serif!important;font-size:19px!important;color:var(--purple)!important;font-weight:500!important}.field p{font-size:14px!important;line-height:1.6!important;color:#554d53!important}
.monthgrid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important}.month{background:rgba(255,252,246,.75)!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:18px 10px!important}.month strong{font-family:Georgia,"Times New Roman",serif!important;color:var(--purple)!important}.bar{background:#e9dfd2!important}.bar i{background:linear-gradient(90deg,var(--purple2),var(--gold))!important}

#calcinfo{display:none!important}.reading-code{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:0;margin-top:22px;background:rgba(255,251,244,.94);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 28px rgba(51,38,31,.06);position:relative;z-index:2}.reading-code .rcell{padding:28px 18px;text-align:center;border-left:1px solid var(--line)}.reading-code .rcell:first-child{border-left:0}.reading-code .rlabel{font-size:11px;letter-spacing:.12em;font-weight:800;color:#746c72;text-transform:uppercase}.reading-code .rnum{font-family:Georgia,"Times New Roman",serif;font-size:45px;color:var(--purple);margin:12px 0 4px}.reading-code .rname{font-family:Georgia,"Times New Roman",serif;font-size:17px;color:#5b3c75}.reading-code .rdesc{font-size:12px;line-height:1.55;color:#6e666b;margin-top:8px}.reading-code .final{background:linear-gradient(150deg,#fffaf0,#f0e5d5)}.reading-code .final .rnum{font-size:38px;color:#9b732a}
.how{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}.how-title{font-family:Georgia,"Times New Roman",serif;font-size:25px;color:var(--purple)}
.side{position:fixed;left:0;top:0;bottom:0;width:188px;background:linear-gradient(180deg,#211a32,#2d2140);color:#fff;z-index:9999;padding:42px 22px;box-shadow:8px 0 30px rgba(32,24,43,.15)}.brand{font-family:Georgia,"Times New Roman",serif;color:#e2c277;font-size:28px;line-height:1.05;letter-spacing:.06em}.brand small{display:block;font-family:Inter,sans-serif;color:#d9cfda;font-size:11px;letter-spacing:.2em;margin-top:10px}.side .tag{margin:28px 0 36px;color:#cfc4d1;font-size:13px;line-height:1.6}.navitem{display:flex;align-items:center;gap:11px;padding:15px 4px;color:#eee8ef;font-size:13px;border-left:1px solid rgba(213,179,107,.3)}.navdot{width:24px;height:24px;border:1px solid #9e8aa9;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#d5b36b}.navitem.active{color:#fff;font-weight:700}.navitem.active .navdot{background:#b58a3a;border-color:#b58a3a;color:#fff}.seal{position:absolute;bottom:30px;left:28px;color:#b58a3a;font-size:34px;opacity:.8}
.tiger{position:absolute;right:-30px;top:5px;width:560px;height:560px;z-index:1;pointer-events:none;opacity:.22}.tiger svg{width:100%;height:100%}.mountain{position:absolute;left:0;bottom:0;width:260px;height:360px;opacity:.08;pointer-events:none}
@media(max-width:850px){.side{display:none}.wrap{padding:28px 18px 60px!important}header h1{font-size:42px!important}.fields{grid-template-columns:1fr 1fr!important}.field:nth-child(3){border-left:0}.monthgrid{grid-template-columns:1fr 1fr!important}.reading-code{grid-template-columns:1fr 1fr}.reading-code .rcell:nth-child(3){border-left:0;border-top:1px solid var(--line)}.reading-code .rcell:nth-child(4){border-top:1px solid var(--line)}.tiger{width:340px;height:340px;right:-80px;top:0;opacity:.11}}
@media(max-width:560px){header h1{font-size:34px!important}.grid{grid-template-columns:1fr!important}.fields,.monthgrid,.reading-code{grid-template-columns:1fr!important}.reading-code .rcell{border-left:0!important;border-top:1px solid var(--line)}.reading-code .rcell:first-child{border-top:0}.hero{grid-template-columns:1fr!important}.score,.grade{text-align:left}.tiger{display:none}}
`;
function clean(s){if(!s)return s;s=s.replace(cycle,(_,b)=>animals[b]||b);s=s.replace(/Theme(?:\s*Theme)+/gi,'Key Theme');s=s.replace(/\bGua\s*Code\b/gi,'Reading Code');s=s.replace(/\b(Upper|Middle|Lower)\s+Gua\b/gi,(_,p)=>p+' Trigram');s=s.replace(/\bFinal\s+144\s+Gua\b/gi,'Final Reading');s=s.replace(/\bGua\s*(Name|Number|No\.?|Result|Details|Interpretation|Meaning|Type|Title|Index)\b/gi,(_,w)=>'Reading '+({Name:'Name',Number:'Number',No:'Number',Result:'Result',Details:'Details',Interpretation:'Interpretation',Meaning:'Meaning',Type:'Type',Title:'Title',Index:'Index'}[w]||w));s=s.replace(/\bGua\b/gi,'Reading');return s}
function textClean(doc){const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>{const x=clean(n.nodeValue);if(x!==n.nodeValue)n.nodeValue=x})}
function makeSide(doc){if(doc.querySelector('.side'))return;const s=doc.createElement('aside');s.className='side';s.innerHTML='<div class="brand">MYKYU<br>SYSTEM<small>TRADITIONAL WISDOM</small></div><div class="tag">Traditional insight<br>for modern life.</div><div class="navitem active"><span class="navdot">✦</span>Overview</div><div class="navitem"><span class="navdot">◈</span>Yearly Outlook</div><div class="navitem"><span class="navdot">◇</span>Life Areas</div><div class="navitem"><span class="navdot">◌</span>Monthly Flow</div><div class="navitem"><span class="navdot">⌘</span>How It Works</div><div class="seal">印</div>';doc.body.appendChild(s)}
function makeTiger(doc){if(doc.querySelector('.tiger'))return;const t=doc.createElement('div');t.className='tiger';t.innerHTML='<svg viewBox="0 0 600 600" aria-hidden="true"><defs><linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#201b2c"/><stop offset="1" stop-color="#7c664b"/></linearGradient></defs><circle cx="430" cy="150" r="105" fill="#b58a3a" opacity=".16"/><path d="M225 510c-35-45-53-100-45-165 7-56 31-104 76-132-8-39 5-73 38-94l-27-55 66 31c45-21 108-10 137 22l61-28-25 58c28 34 38 77 31 121-10 65-55 120-119 149-43 20-91 28-140 22z" fill="url(#ink)" opacity=".76"/><path d="M278 202c18-46 67-73 126-63 57 9 93 53 90 108-3 57-34 108-84 131-56 26-113 5-137-49-17-38-15-91 5-127z" fill="#f7f0e4" opacity=".88"/><path d="M300 226l31-20M286 259l42-7M286 299l42 4M301 343l34-15M424 205l-30 19M443 240l-42 4M448 282l-45-1M430 326l-37-11" stroke="#201b2c" stroke-width="13" stroke-linecap="round" opacity=".8"/><ellipse cx="335" cy="276" rx="11" ry="16" fill="#201b2c"/><ellipse cx="415" cy="276" rx="11" ry="16" fill="#201b2c"/><circle cx="335" cy="279" r="3" fill="#d5b36b"/><circle cx="415" cy="279" r="3" fill="#d5b36b"/><path d="M355 319q20 16 40 0M375 303v15" fill="none" stroke="#201b2c" stroke-width="8" stroke-linecap="round"/><path d="M200 460q-75-25-132-98M213 486q-86 4-145-37M205 433q-52-58-70-115" stroke="#201b2c" stroke-width="17" stroke-linecap="round" opacity=".25"/><path d="M72 116q105-60 202-30M90 137q90-34 160-20" stroke="#201b2c" stroke-width="7" opacity=".18" fill="none"/></svg>';doc.body.prepend(t)}
function makeReadingCode(doc){const table=doc.getElementById('calcinfo');if(!table||doc.querySelector('.reading-code'))return;let vals={upper:'4',middle:'1',lower:'3',final:'4-1-3'};table.querySelectorAll('tr').forEach(tr=>{const cells=tr.querySelectorAll('td');if(cells.length<2)return;const k=cells[0].textContent.trim().toLowerCase(),v=cells[1].textContent.trim();if(/upper/.test(k)&&v)vals.upper=v;if(/middle/.test(k)&&v)vals.middle=v;if(/lower/.test(k)&&v)vals.lower=v;if(/final/.test(k)&&v)vals.final=v});const d=doc.createElement('section');d.className='reading-code';d.innerHTML='<div class="rcell"><div class="rlabel">Upper Trigram</div><div class="rnum">'+clean(vals.upper)+'</div><div class="rname">Mountain</div><div class="rdesc">Stillness &amp; preparation</div></div><div class="rcell"><div class="rlabel">Middle Trigram</div><div class="rnum">'+clean(vals.middle)+'</div><div class="rname">Heaven</div><div class="rdesc">Creative power &amp; initiative</div></div><div class="rcell"><div class="rlabel">Lower Trigram</div><div class="rnum">'+clean(vals.lower)+'</div><div class="rname">Water</div><div class="rdesc">Flow &amp; adaptability</div></div><div class="rcell final"><div class="rlabel">Final Reading</div><div class="rnum">'+clean(vals.final)+'</div><div class="rname">Your path this year</div><div class="rdesc">A symbolic summary of your annual reading</div></div>';const result=doc.getElementById('result');if(result)result.insertBefore(d,table.closest('.card')||result.lastElementChild)}
function decorate(f){try{const doc=f.contentDocument;if(!doc||!doc.body)return; if(!doc.getElementById('mykyu-final-ui')){const st=doc.createElement('style');st.id='mykyu-final-ui';st.textContent=css;doc.head.appendChild(st)}makeSide(doc);makeTiger(doc);textClean(doc);makeReadingCode(doc);const h=doc.querySelector('header h1');if(h)h.textContent='YOUR YEAR AT A GLANCE';const sub=doc.querySelector('header .sub');if(sub)sub.textContent='A thoughtful annual reading based on traditional Korean fortune methods, presented for modern life.';const result=doc.getElementById('result');if(result&&result.style.display!=='none')makeReadingCode(doc)}catch(e){}}
const f=document.getElementById('app');f.addEventListener('load',()=>{decorate(f);[100,400,900,1800,3500,6000].forEach(t=>setTimeout(()=>decorate(f),t))});
})();
