const SHARP_CSS=`

.gender button.active{border-color:#4c2878!important;background:linear-gradient(180deg,#5c3688,#43216f)!important;color:#fff!important;box-shadow:0 3px 8px rgba(66,32,104,.14)!important}

@media(max-width:1000px) and (min-width:641px){.app{padding:5px 4px 26px!important}.top{grid-template-columns:44% 56%!important}.form-panel{padding:11px 10px 11px!important}.privacy{font-size:9px!important;margin-bottom:8px!important}.form-box{padding:11px 9px 10px!important}.form-title{font-size:23px!important;margin-bottom:11px!important}.form-title:before,.form-title:after{font-size:14px!important;margin:0 6px!important}.grid{gap:8px 8px!important}label{font-size:9.5px!important;margin-bottom:4px!important}input,select,.gender button{height:36px!important;font-size:11px!important}.reveal{height:45px!important;font-size:17px!important;margin-top:10px!important}.status{margin-top:4px!important;font-size:9px!important}}
@media(max-width:760px) and (min-width:641px){.top{grid-template-columns:42% 58%!important}.form-title{font-size:21px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.art{align-self:stretch!important}.art img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:left top!important}}
@media(max-width:640px){.app{padding:5px!important}.top{grid-template-columns:1fr!important;border-radius:10px!important}.art{min-height:0!important;align-self:auto!important}.art img{width:100%!important;height:auto!important;object-fit:initial!important}.form-panel{padding:14px 9px!important}.privacy{text-align:center!important;margin-bottom:12px!important;font-size:10px!important}.form-box{padding:14px 10px!important;border-radius:8px!important}.form-title{font-size:25px!important;margin-bottom:15px!important}.form-title:before,.form-title:after{display:none!important}.grid{grid-template-columns:1fr!important;gap:11px!important}label{font-size:11px!important}input,select,.gender button{height:43px!important;font-size:12px!important}.reveal{height:54px!important;font-size:19px!important;margin-top:15px!important}}
`;
async function buildApprovedArt(){
  const parts=[];
  for(let i=0;i<7;i++){
    const r=await fetch(`./assets/approved-art.b64.${i}?v=20260828-restored1`,{cache:'no-store'});
    if(!r.ok)throw new Error('approved art part '+i+' failed');
    parts.push((await r.text()).replace(/\s+/g,''));
  }
  const joined=parts.join('');
  if(joined.length!==93040)throw new Error('approved art length mismatch: '+joined.length);
  return 'data:image/webp;base64,'+joined;
}
async function applyProductionUI(){
  try{
    const doc=app.contentDocument;
    if(!doc)return;
    let style=doc.getElementById('sharp-production-style');
    if(!style){style=doc.createElement('style');style.id='sharp-production-style';style.textContent=SHARP_CSS;doc.head.appendChild(style)}
    const img=doc.getElementById('folkArt');
    if(img){
      img.style.visibility='hidden';
      try{
        const src=await buildApprovedArt();
        img.onload=()=>{img.style.visibility='visible'};
        img.onerror=()=>{img.style.visibility='visible';img.src='./assets/hojakdo-app6.webp?v=20260828-safe4'};
        img.src=src;
      }catch(err){
        console.error('approved artwork',err);
        img.style.visibility='visible';
        img.src='./assets/hojakdo-app6.webp?v=20260828-safe4';
      }
      img.style.width='100%';
      img.style.height='auto';
      img.style.objectFit='initial';
      img.style.objectPosition='initial';
    }
  }catch(e){console.error('production ui',e)}
}
app.addEventListener('load',applyProductionUI);
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='TOJEONG_HEIGHT')return;app.style.height=Math.max(1000,Math.min(14000,Number(e.data.height)||1900))+'px'});
</script>
