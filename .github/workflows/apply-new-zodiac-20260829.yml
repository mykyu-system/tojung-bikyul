name: Apply New Zodiac Artwork
on:
  push:
    paths:
      - '.github/workflows/apply-new-zodiac-20260829.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update zodiac mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('english.html')
          s=p.read_text()
          s=s.replace("const ZODIAC_POS={Rat:[0,0],Ox:[1,0],Tiger:[2,0],Rabbit:[3,0],Dragon:[0,1],Snake:[1,1],Horse:[2,1],Goat:[3,1],Monkey:[0,2],Rooster:[1,2],Dog:[2,2],Pig:[3,2]};", "const ZODIAC_POS={Rat:[0,0],Ox:[1,0],Tiger:[2,0],Rabbit:[3,0],Dragon:[4,0],Snake:[5,0],Horse:[0,1],Goat:[1,1],Monkey:[2,1],Rooster:[3,1],Dog:[4,1],Pig:[5,1]};")
          s=s.replace("function buildZodiac(){if(!zodiacSpritePromise)zodiacSpritePromise=Promise.resolve('./assets/zodiac-sharp-20260829.png?v=20260829-sharp1');return zodiacSpritePromise}", "function buildZodiac(){if(!zodiacSpritePromise)zodiacSpritePromise=Promise.resolve('./assets/zodiac-new-20260829.webp?v=20260829-new1');return zodiacSpritePromise}")
          s=s.replace("t.style.backgroundSize='400% 300%';t.style.backgroundPosition=(p[0]*100/3)+'% '+(p[1]*50)+'%'", "t.style.backgroundSize='600% 200%';t.style.backgroundPosition=(p[0]*20)+'% '+(p[1]*100)+'%'")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply newly generated high-resolution zodiac artwork'
          git push
