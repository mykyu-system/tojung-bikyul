<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mykyu-system · 토정비결 완결판</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#707781;--line:#e5e7eb;--accent:#5b4bd8;--good:#16845b;--warn:#b56a00;--bad:#b63b3b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px} header{padding:18px 4px 22px} h1{margin:0 0 7px;font-size:28px} .sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px rgba(0,0,0,.035)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input,select,button{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);padding:0 12px;font-size:15px;background:#fff}
button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:12px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
.hidden{display:none} .hero{display:grid;grid-template-columns:1fr 1fr;gap:12px} .score{font-size:40px;font-weight:800} .grade{font-weight:800;margin-left:8px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0efff;color:var(--accent);font-size:12px;font-weight:700}
@media(max-width:650px){.grid,.hero{grid-template-columns:1fr}.wrap{padding:16px 12px 40px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Mykyu-system 토정비결</h1><div class="sub">생년월일을 입력하면 개인별 토정비결을 확인할 수 있습니다.</div></header>
<section class="card">
<div class="grid">
<div><label>출생년도</label><input id="year" type="number" min="1900" max="2100" placeholder="예: 1974"></div>
<div><label>출생월</label><select id="month"></select></div>
<div><label>출생일</label><input id="day" type="number" min="1" max="31" placeholder="예: 27"></div>
</div>
<button id="go">토정비결 보기</button>
<div class="note">※ 입력한 생년월일은 이 페이지에서 결과를 계산하기 위한 용도로만 사용됩니다.</div>
</section>
<section id="result" class="hidden"></section>
</div>
<script>
for(let i=1;i<=12;i++) document.getElementById('month').insertAdjacentHTML('beforeend',`<option value="${i}">${i}월</option>`);
let APP;
async function loadData(){
 const r=await fetch('./Mykyu-system_TOJEONG_100_FINAL.json',{cache:'no-store'});
 if(!r.ok) throw new Error('JSON load failed');
 APP=await r.json();
}
function pick(arr, n){return arr[Math.abs(n)%arr.length]}
function render(y,m,d){
 const seed=(y*37+m*101+d*1009)>>>0;
 const root=document.getElementById('result');
 const data=APP;
 let text='';
 if(Array.isArray(data)) text=pick(data,seed);
 else if(Array.isArray(data.results)) text=pick(data.results,seed);
 else if(Array.isArray(data.items)) text=pick(data.items,seed);
 else text=data;
 let pretty=typeof text==='string'?text:JSON.stringify(text,null,2);
 root.innerHTML=`<div class="card"><span class="badge">개인 맞춤 결과</span><h2>${y}년 ${m}월 ${d}일생</h2><div style="white-space:pre-wrap;line-height:1.8">${pretty}</div></div>`;
 root.classList.remove('hidden');
}
document.getElementById('go').addEventListener('click',async()=>{
 const y=Number(document.getElementById('year').value),m=Number(document.getElementById('month').value),d=Number(document.getElementById('day').value);
 if(!y||!d){alert('출생년과 출생일을 입력해주세요.');return}
 try{if(!APP) await loadData();render(y,m,d)}catch(e){console.error(e);alert('운세 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');}
});
</script>
</body>
</html>
