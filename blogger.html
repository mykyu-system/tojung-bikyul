<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Mykyu-system Personal Fortune</title><style>html,body{margin:0;padding:0;background:#fff;overflow:hidden}#app{display:block;width:100%;height:760px;min-height:0;border:0;background:#efe6d8;overflow:hidden}</style></head><body><iframe id="app" src="https://mykyu-system.github.io/tojung-bikyul/english.html?v=blogger-hardlock2-20260828" title="Mykyu-system Personal Fortune" loading="eager" allow="fullscreen" scrolling="no"></iframe><script>(function(){const app=document.getElementById('app');let initialDone=false,resultDone=false,currentHeight=760,currentMode='initial';function relay(){if(!initialDone)return;try{parent.postMessage({type:'TOJEONG_BLOGGER_HEIGHT',height:currentHeight,mode:currentMode},'*')}catch(e){}}function setH(v,m){const h=Math.max(360,Math.min(24000,Math.ceil(Number(v)||760));if(m==='initial'){if(resultDone)return;initialDone=true}else{if(resultDone)return;resultDone=true}currentHeight=h;currentMode=m;app.style.height=h+'px';document.documentElement.style.height=h+'px';document.body.style.height=h+'px';relay()}window.addEventListener('message',e=>{if(!e.data)return;if(e.data.type==='TOJEONG_EMBED_HEIGHT')setH(e.data.height,e.data.mode==='result'?'result':'initial');if(e.data.type==='TOJEONG_REQUEST_HEIGHT')relay()});})();</script></body></html>
