name: Patch Input UI Design
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_input_ui.py'
      - '.github/workflows/patch-input-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip input-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply input UI design only
        run: python scripts/patch_input_ui.py
      - name: Commit input UI design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-app4.html
          git diff --cached --quiet || git commit -m 'Update input UI design only [skip input-ui]'
          git push
