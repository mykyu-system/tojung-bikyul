<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Tojung Bi Kyul — 144 Korean Fortune Readings</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow:hidden;background:#efe6d8}
#stage{display:block;width:100%;height:620px;border:0;background:#efe6d8;overflow:hidden}
@media(max-width:1000px) and (min-width:641px){#stage{height:524px}}
@media(max-width:640px){#stage{height:1180px}}
</style>
</head>
<body>
<iframe id="stage" src="./english-v4.html?v=20260828-compact1" title="Tojung Bi Kyul" scrolling="no"></iframe>
<script>
(function(){
  const stage=document.getElementById('stage');
  let state='initial';
  let resultDone=false;
  let detailObserver=null;

  function initialHeight(){
    if(window.matchMedia('(max-width:640px)').matches)return 1180;
    if(window.matchMedia('(max-width:1000px)').matches)return 524;
    return 620;
  }

  function deep(){
    try{
      const outer=stage.contentDocument;
      const shell=outer&&outer.getElementById('shell');
      const middle=shell&&shell.contentDocument;
      const app=middle&&middle.getElementById('app');
      const doc=app&&app.contentDocument;
      if(!outer||!shell||!middle||!app||!doc)return null;
      return {outer,shell,middle,app,doc};
    }catch(e){return null}
  }

  function upsert(doc,id,css){
    let s=doc.getElementById(id);
    if(!s){s=doc.createElement('style');s.id=id;doc.head.appendChild(s)}
    s.textContent=css;
  }

  function freezeAll(refs,h){
    h=Math.max(360,Math.min(24000,Math.ceil(h)));
    upsert(refs.outer,'tojung-hard-shell',`html,body{margin:0!important;height:${h}px!important;overflow:hidden!important}#shell{height:${h}px!important;min-height:${h}px!important;max-height:${h}px!important;overflow:hidden!important}`);
    upsert(refs.middle,'tojung-hard-app',`html,body{margin:0!important;height:${h}px!important;overflow:hidden!important}#app{height:${h}px!important;min-height:${h}px!important;max-height:${h}px!important;overflow:hidden!important}`);
    stage.style.height=h+'px';
    document.documentElement.style.height=h+'px';
    document.body.style.height=h+'px';
    stage.setAttribute('scrolling','no');
    refs.shell.setAttribute('scrolling','no');
    refs.app.setAttribute('scrolling','no');
    refs.doc.documentElement.style.overflow='hidden';
    if(refs.doc.body)refs.doc.body.style.overflow='hidden';
    return h;
  }

  function post(type,h){
    try{parent.postMessage({type,height:h},'*')}catch(e){}
  }

  function fullBottom(doc){
    const result=doc.getElementById('result');
    const detail=doc.getElementById('detail');
    if(!result||!detail||!detail.classList.contains('show'))return 0;
    const r=result.getBoundingClientRect();
    const y=doc.defaultView?doc.defaultView.scrollY:0;
    const app=doc.querySelector('.app');
    let pad=18;
    try{if(app)pad=parseFloat(doc.defaultView.getComputedStyle(app).paddingBottom)||18}catch(e){}
    return Math.ceil(r.bottom+y+pad+2);
  }

  function settleResult(){
    if(state!=='initial'||resultDone)return;
    state='settling';
    let samples=0,maxH=0;
    const timer=setInterval(()=>{
      const refs=deep();
      if(refs){
        const h=fullBottom(refs.doc);
        if(h>maxH)maxH=h;
      }
      samples++;
      if(samples>=10){
        clearInterval(timer);
        const refs2=deep();
        if(!refs2||!maxH){state='initial';return}
        const finalH=freezeAll(refs2,maxH);
        resultDone=true;
        state='result';
        post('TOJEONG_RESULT_EXPAND',finalH);
      }
    },120);
  }

  function watchResult(refs){
    if(detailObserver)detailObserver.disconnect();
    const detail=refs.doc.getElementById('detail');
    if(!detail)return;
    detailObserver=new MutationObserver(()=>{
      if(detail.classList.contains('show'))settleResult();
    });
    detailObserver.observe(detail,{attributes:true,attributeFilter:['class']});
    if(detail.classList.contains('show'))settleResult();
  }

  function apply(){
    const refs=deep();
    if(!refs)return false;
    let link=refs.doc.getElementById('tojung-final-polish-link');
    if(!link){
      link=refs.doc.createElement('link');
      link.id='tojung-final-polish-link';
      link.rel='stylesheet';
      link.href='./assets/final-polish-20260828.css?v=6';
      refs.doc.head.appendChild(link);
    }
    freezeAll(refs,initialHeight());
    watchResult(refs);
    post('TOJEONG_INITIAL_LOCK',initialHeight());
    return true;
  }

  function retry(){
    let n=0;
    const t=setInterval(()=>{
      n++;
      if(apply()||n>70)clearInterval(t);
    },90);
  }

  stage.addEventListener('load',retry);
  retry();
})();
</script>
</body>
</html>
