name: Patch English Display Labels
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_display_labels.py'
      - '.github/workflows/patch-display.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch calculator labels
        run: python scripts/patch_display_labels.py
      - name: Commit patched calculator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-app4.html
          git diff --cached --quiet || git commit -m 'Patch zodiac and reading labels in calculator'
          git push
