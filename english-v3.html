<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tojung Bi Kyul — 144 Readings Fortune Calculator</title>
<style>
html,body{margin:0;padding:0;background:#efe5d3;overflow-x:hidden}
#shell{display:block;width:100%;height:1900px;min-height:100vh;border:0;background:#efe5d3}
</style>
</head>
<body>
<iframe id="shell" src="./english-v2.html?v=20260828-center1" title="Tojung Bi Kyul 144 Readings Fortune Calculator" loading="eager" scrolling="no"></iframe>
<script>
const shell=document.getElementById('shell');
const CELL={Rat:[0,0],Ox:[1,0],Tiger:[2,0],Rabbit:[3,0],Dragon:[0,1],Snake:[1,1],Horse:[2,1],Goat:[3,1],Monkey:[0,2],Rooster:[1,2],Dog:[2,2],Pig:[3,2]};
// Per-animal visual-center correction measured from the 96x96 sprite cells.
const SHIFT={Rat:[-2,-7],Ox:[5,-5],Tiger:[1,-7],Rabbit:[0,-3],Dragon:[-3,-5],Snake:[-6,-10],Horse:[-7,-7],Goat:[-8,-12],Monkey:[-8,-5],Rooster:[-15,-7],Dog:[-16,-7],Pig:[-18,-9]};
let tiles=null,patchStarted=false,heightTimer=null;
function deep(){
  try{
    const outer=shell.contentDocument;
    const app=outer&&outer.getElementById('app');
    return {outer,app,doc:app&&app.contentDocument};
  }catch(e){return {outer:null,app:null,doc:null}}
}
function syncHeight(){
  try{
    const outer=shell.contentDocument;
    if(!outer)return;
    const h=Math.max(1000,outer.body?.scrollHeight||0,outer.documentElement?.scrollHeight||0);
    shell.style.height=Math.min(14000,h)+'px';
  }catch(e){}
}
function dataUrlFromBackground(el){
  const bg=(el&&el.style.backgroundImage)||'';
  const m=bg.match(/url\(["']?(data:image\/[^"')]+)["']?\)/i);
  return m?m[1]:null;
}
function makeTiles(sprite){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const sw=img.naturalWidth/4,sh=img.naturalHeight/3;
      const result={};
      for(const [name,[c,r]] of Object.entries(CELL)){
        const canvas=document.createElement('canvas');
        canvas.width=192;canvas.height=192;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#f5ead6';ctx.fillRect(0,0,192,192);
        const inset=2,sx=c*sw+inset,sy=r*sh+inset,cw=sw-inset*2,ch=sh-inset*2;
        const [dx,dy]=SHIFT[name]||[0,0];
        const dw=184,dh=184,baseX=4,baseY=4;
        ctx.drawImage(img,sx,sy,cw,ch,baseX+dx*2,baseY+dy*2,dw,dh);
        result[name]=canvas.toDataURL('image/webp',.92);
      }
      resolve(result);
    };
    img.onerror=reject;img.src=sprite;
  });
}
function applyOne(doc,nameId,targetId){
  const nameEl=doc.getElementById(nameId),target=doc.getElementById(targetId);
  if(!nameEl||!target)return;
  const render=()=>requestAnimationFrame(()=>{
    const name=(nameEl.textContent||'').trim();
    if(!tiles||!tiles[name])return;
    target.textContent='';
    target.style.backgroundImage=`url("${tiles[name]}")`;
    target.style.backgroundSize='cover';
    target.style.backgroundPosition='center center';
    target.style.backgroundRepeat='no-repeat';
    target.style.backgroundColor='#f5ead6';
    target.setAttribute('aria-label',name+' centered minhwa animal illustration');
  });
  render();
  new MutationObserver(render).observe(nameEl,{childList:true,characterData:true,subtree:true});
}
async function startPatch(){
  if(patchStarted)return;
  const {outer,app,doc}=deep();
  if(!outer||!app||!doc){setTimeout(startPatch,80);return}
  patchStarted=true;
  let attempts=0,sprite=null;
  while(attempts++<80&&!sprite){
    sprite=dataUrlFromBackground(doc.getElementById('yearEmoji'))||dataUrlFromBackground(doc.getElementById('dayEmoji'));
    if(!sprite)await new Promise(r=>setTimeout(r,75));
  }
  if(sprite){
    try{tiles=await makeTiles(sprite)}catch(e){console.error('zodiac centering',e)}
  }
  if(tiles){
    applyOne(doc,'yearZodiac','yearEmoji');
    applyOne(doc,'dayZodiac','dayEmoji');
  }
  try{
    const ro=new ResizeObserver(syncHeight);ro.observe(outer.documentElement);if(outer.body)ro.observe(outer.body);
  }catch(e){}
  syncHeight();
  heightTimer=setInterval(syncHeight,600);
}
shell.addEventListener('load',()=>{patchStarted=false;tiles=null;startPatch();syncHeight()});
window.addEventListener('beforeunload',()=>{if(heightTimer)clearInterval(heightTimer)});
</script>
</body>
</html>
