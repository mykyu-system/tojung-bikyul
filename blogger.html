<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system Tojeong</title><style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:100%;min-height:3500px;border:0}</style></head><body><iframe id="app" title="Mykyu-system Tojeong Fortune" loading="eager"></iframe><script>(async()=>{const frame=document.getElementById('app');try{let html=await fetch('./index.html?embed='+Date.now(),{cache:'no-store'}).then(r=>r.text());const patch=`<base href="https://mykyu-system.github.io/tojung-bikyul/"><script>function dayGanjiFromSolar(s){const p=s.split('-').map(Number),base=Date.UTC(2000,0,7),cur=Date.UTC(p[0],p[1]-1,p[2]),n=((Math.round((cur-base)/86400000)%60)+60)%60,st=['갑','을','병','정','무','기','경','신','임','계'],br=['자','축','인','묘','진','사','오','미','신','유','술','해'];return st[n%10]+br[n%12]}<\/script>`;html=html.replace('<head>','<head>'+patch);html=html.replace('let age=ty-ly+1,tg=APP.calculation.jogyeonpyo?.[String(ty)]?.간지||yg(ty),row=APP.calculation.jogyeonpyo?.[String(ty)]','let age=ty-ly+1,tg=yg(ty),row=APP.calculation.jogyeonpyo?.[tg]');html=html.replace("dg=targetSolar?APP.calculation.solar_to_lunar?.[targetSolar]?.dayGanji:''","dg=targetSolar?dayGanjiFromSolar(targetSolar):''");frame.srcdoc=html}catch(e){document.body.innerHTML='<p style="padding:20px">Unable to load the fortune calculator.</p>'}})();</script></body></html>
