<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system · 토정비결 100점 완성판</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#6b7280;--line:#e2e5ea;--a:#5b4bd8;--soft:#f1efff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:940px;margin:auto;padding:20px 14px 60px}header{padding:8px 2px 20px}h1{font-size:29px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:17px 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;margin:12px 0;box-shadow:0 3px 14px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}input,button{height:46px;width:100%;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:15px;background:#fff}button{margin-top:12px;background:var(--a);color:#fff;border:0;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#fff;color:var(--text);border:1px solid var(--line)}.tabs button.active{background:var(--soft);color:var(--a);border-color:#d9d3ff}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.badge{display:inline-block;background:var(--soft);color:var(--a);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.score{font-size:42px;font-weight:900}.muted,.note,.foot{color:var(--muted)}p{line-height:1.75;margin:7px 0}.note,.foot{font-size:12px;line-height:1.7;margin-top:10px}table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--line);padding:9px 4px;vertical-align:top}td:first-child{width:31%;color:var(--muted)}.months{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.month{border:1px solid var(--line);border-radius:14px;padding:13px}.bar{height:6px;background:#eee;border-radius:99px;margin:8px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:99px}.hidden{display:none}.error{color:#b33b3b;font-size:13px;margin-top:8px}.pill{display:inline-block;border:1px solid var(--line);padding:5px 8px;border-radius:99px;margin:3px 3px 0 0;font-size:12px}@media(max-width:680px){.grid,.hero,.months{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><h1>Mykyu-system</h1><div class="muted">토정비결 144괘 · 100점 완성판</div></header><section class="card"><h2>생년월일 입력</h2><div class="tabs"><button id="solarBtn" class="active" onclick="setMode('solar')">양력</button><button id="lunarBtn" onclick="setMode('lunar')">음력</button></div><div class="grid" style="margin-top:10px"><div><label>출생 연도</label><input id="by" type="number" min="1900" max="2050" placeholder="예: 1974"></div><div><label>출생 월</label><input id="bm" type="number" min="1" max="12" placeholder="1~12"></div><div><label>출생 일</label><input id="bd" type="number" min="1" max="31" placeholder="1~31"></div></div><div id="leapBox" class="hidden" style="margin-top:10px"><label><input id="leap" type="checkbox" style="width:auto;height:auto"> 윤달 생일</label></div><div class="grid"><div><label>운세 연도</label><input id="ty" type="number" min="1900" max="2050" value="2026"></div><div></div><div></div></div><button onclick="calculate()">토정비결 보기</button><div id="err" class="error"></div><div class="note">양력/음력 모두 입력할 수 있습니다. 1900~2050년 지원. 음력 윤달도 선택 가능합니다.</div></section><section id="result" class="hidden"><div class="card hero"><div><span class="badge" id="q"></span><h2 id="qn"></h2><div class="muted" id="meta"></div></div><div><div class="score" id="sc"></div><b id="gr"></b></div></div><div class="card"><h2>올해 한 줄</h2><p id="sum"></p><div id="keywords"></div></div><div class="card"><h2>개인 맞춤 해석</h2><p id="personal"></p><table id="personalTable"></table></div><div class="card"><h2>분야별 운세</h2><div id="fields"></div></div><div class="card"><h2>1~12월 운세</h2><div class="months" id="months"></div></div><div class="card"><h2>작괘 계산 검증</h2><table id="calcinfo"></table></div><div class="card"><h2>최종 판단</h2><p id="fin"></p><table id="last"></table></div><div class="foot">토정비결은 전통 운세 문화 콘텐츠입니다. 과학적 예측이 아니므로 의료·법률·투자·계약 등 중요한 결정은 객관적인 자료와 전문가의 판단을 우선하세요.</div></section></div><script>let APP=null;let APP_READY=false;fetch('./Mykyu-system_TOJEONG_100_FINAL.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('운세 데이터 로드 실패');return r.json()}).then(d=>{APP=d;APP_READY=true}).catch(e=>{console.error(e);document.getElementById('err').textContent='운세 데이터를 불러오지 못했습니다. JSON 파일이 같은 폴더에 있는지 확인해주세요.'});let mode="solar";const S=["갑","을","병","정","무","기","경","신","임","계"],B=["자","축","인","묘","진","사","오","미","신","유","술","해"];function setMode(m){mode=m;document.getElementById("solarBtn").classList.toggle("active",m==="solar");document.getElementById("lunarBtn").classList.toggle("active",m==="lunar");document.getElementById("leapBox").classList.toggle("hidden",m!=="lunar")}function yg(y){let i=((y-4)%60+60)%60;return S[i%10]+B[i%12]}function rem(n,k){let r=n%k;return r===0?k:r}function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function mgj(y,m){let g=yg(y),si=S.indexOf(g[0]);return S[(si*2+m+1)%10]+B[(m+1)%12]}function personalText(age,lm,ld){let a=age%2===0?"계획을 세운 뒤 단계적으로 실행하는 흐름이 잘 맞는 해입니다.":"기회를 잡았을 때 빠르게 움직이되 중간 점검을 병행하는 흐름이 좋습니다.";let b=lm<=4?"상반기 초반의 준비와 정리가 중요합니다.":lm<=8?"올해는 중반부의 선택과 인간관계가 핵심입니다.":"후반부의 정리·회수·재편이 중요합니다.";let c=ld%3===0?"금전에서는 확장보다 현금흐름과 손실 관리가 우선입니다.":ld%3===1?"기회는 작은 규모로 시험한 뒤 확대하는 전략이 유리합니다.":"사람을 통한 정보와 기회가 들어올 수 있으니 약속과 문서를 꼼꼼히 확인하세요.";return a+" "+b+" "+c}function calculate(){if(!APP_READY){document.getElementById("err").textContent="운세 데이터를 불러오는 중입니다. 잠시 후 다시 눌러주세요.";return}let by=+document.getElementById("by").value,bm=+document.getElementById("bm").value,bd=+document.getElementById("bd").value,ty=+document.getElementById("ty").value,leap=document.getElementById("leap").checked,e=document.getElementById("err");e.textContent="";if(by<1900||by>2050||bm<1||bm>12||bd<1||ty<1900||ty>2050){e.textContent="1900~2050년 범위와 날짜를 확인해 주세요.";return}let ly,lm,ld,lf=false;if(mode==="solar"){let s=`${String(by).padStart(4,"0")}-${String(bm).padStart(2,"0")}-${String(bd).padStart(2,"0")}`,x=APP.calculation.solar_to_lunar[s];if(!x){e.textContent="존재하지 않는 날짜입니다.";return}ly=x.y;lm=x.m;ld=x.d;lf=x.leap}else{if(bd>30){e.textContent="음력 날짜는 1~30일입니다.";return}let s=APP.calculation.lunar_to_solar[`${by}-${bm}-${bd}-${leap?1:0}`];if(!s){e.textContent="존재하지 않는 음력 날짜 또는 윤달입니다.";return}ly=by;lm=bm;ld=bd;lf=leap}let age=ty-ly+1,tg=yg(ty),row=APP.calculation.jogyeonpyo[tg],md=APP.calculation.month_days[`${ty}-${lm}`],mg=mgj(ty,lm),mrow=APP.calculation.jogyeonpyo[mg];let targetSolar=APP.calculation.lunar_to_solar[`${ty}-${lm}-${ld}-${lf?1:0}`]||APP.calculation.lunar_to_solar[`${ty}-${lm}-${ld}-0`],dg=APP.calculation.solar_to_lunar[targetSolar]?.dayGanji,drow=APP.calculation.jogyeonpyo[dg];if(!row||!md||!mrow||!drow){e.textContent="작괘 자료를 찾지 못했습니다.";return}let u=rem(age+row.태세수,8),m=rem(md+mrow.월건수,6),l=rem(ld+drow.일진수,3),code=`${u}-${m}-${l}`,g=APP.gwae.find(x=>x.code===code);if(!g){e.textContent="144괘 데이터 오류";return}document.getElementById("result").classList.remove("hidden");document.getElementById("q").textContent=code+"괘";document.getElementById("qn").textContent=g.name;document.getElementById("meta").textContent=`${ty}년 ${tg} · 음력 ${ly}년 ${lm}월 ${ld}일${lf?" (윤달)":""} · 세는나이 ${age}세`;document.getElementById("sc").textContent=g.overall_score+"점";document.getElementById("gr").textContent=g.grade;document.getElementById("sum").textContent=g.summary;document.getElementById("keywords").innerHTML=g.keywords.map(k=>`<span class="pill">${esc(k)}</span>`).join("");document.getElementById("personal").textContent=personalText(age,lm,ld);let fs=[["재물운",g.money],["투자·재테크운",g.detailed.investment],["직업운",g.career],["사업운",g.career],["이직·취업운",g.detailed.job_change],["승진·시험운",g.detailed.promotion_exam],["부동산운",g.detailed.real_estate],["문서·계약운",g.detailed.document_contract],["애정·가정운",g.relationship],["부부·결혼운",g.relationship],["가족·자녀운",g.detailed.children_family],["대인관계·귀인운",g.detailed.social],["구설·갈등운",g.detailed.social],["건강운",g.health],["사고·주의운",g.detailed.accident],["이동·여행운",g.detailed.travel_move]];document.getElementById("fields").innerHTML=fs.map(x=>`<h3>${esc(x[0])}</h3><p>${esc(x[1])}</p>`).join("");document.getElementById("personalTable").innerHTML=[["출생 기준",`${ly}년 음력 ${lm}월 ${ld}일${lf?" 윤달":""}`],["운세 연도",`${ty}년 ${tg}`],["핵심 괘",`${code} · ${g.name}`],["개인화",`나이 ${age} · 생월 ${lm} · 생일 ${ld}`]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("");let good=[...g.monthly_summary].sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.month+"월").join(", "),bad=[...g.monthly_summary].sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.month+"월").join(", ");document.getElementById("months").innerHTML=g.monthly_summary.map(x=>`<div class="month"><b>${x.month}월</b><span style="float:right;font-weight:800">${x.score}점</span><div class="bar"><i style="width:${x.score}%"></i></div><p>${esc(x.headline)}</p><p><b>재물:</b> ${esc(x.money)}</p><p><b>주의:</b> ${esc(x.caution)}</p></div>`).join("");document.getElementById("calcinfo").innerHTML=[["당년 간지",tg],["태세수",row.태세수],["당년 생월 날수",md+"일"],["월건",`${mg} → ${mrow.월건수}`],["당년 생일 일진",`${dg} → ${drow.일진수}`],["상괘",`(${age}+${row.태세수}) ÷ 8 → ${u}`],["중괘",`(${md}+${mrow.월건수}) ÷ 6 → ${m}`],["하괘",`(${ld}+${drow.일진수}) ÷ 3 → ${l}`],["최종 144괘",code]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("");document.getElementById("fin").textContent=g.detailed.final;document.getElementById("last").innerHTML=[["종합점수",g.overall_score+"점"],["등급",g.grade],["길한 달",good],["주의 달",bad],["핵심 키워드",g.keywords.join(" · ") ]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("");document.getElementById("result").scrollIntoView({behavior:"smooth"})}</script></body></html>
