<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu-system Personal Fortune</title><style>html,body{margin:0;padding:0;background:#faf9fc}iframe{display:block;width:100%;height:7600px;min-height:7600px;border:0}</style></head><body><iframe id="app" src="./english-app4.html?v=20260827-zodiac3" title="Mykyu-system Personal Fortune" loading="eager"></iframe><script>(function(){const animals={Zi:'Rat',Chou:'Ox',Yin:'Tiger',Mao:'Rabbit',Chen:'Dragon',Si:'Snake',Wu:'Horse',Wei:'Goat',Shen:'Monkey',You:'Rooster',Xu:'Dog',Hai:'Pig'};const re=/\b(?:Jia|Yi|Bing|Ding|Wu|Ji|Geng|Xin|Ren|Gui)-(Zi|Chou|Yin|Mao|Chen|Si|Wu|Wei|Shen|You|Xu|Hai)\b/g;function cleanText(s){if(!s)return s;s=s.replace(re,(_,branch)=>animals[branch]||branch);s=s.replace(/Theme(?:Theme)+/g,'Key Theme');return s;}function convert(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){const old=n.nodeValue,newv=cleanText(old);if(newv!==old)n.nodeValue=newv;}}function run(f){try{convert(f.contentDocument&&f.contentDocument.body);if(!f.__cleaner&&f.contentDocument){f.__cleaner=new MutationObserver(()=>convert(f.contentDocument.body));f.__cleaner.observe(f.contentDocument.body,{subtree:true,childList:true,characterData:true});}}catch(e){}}document.getElementById('app').addEventListener('load',function(){const f=this;run(f);setTimeout(()=>run(f),300);setTimeout(()=>run(f),1000);setTimeout(()=>run(f),2500);});})();</script></body></html>
