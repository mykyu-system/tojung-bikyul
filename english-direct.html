<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mykyu System Personal Fortune</title><style>html,body{margin:0;background:#f3ecdf}iframe{display:block;width:100%;height:100vh;min-height:980px;border:0}</style></head><body><iframe id="app" src="./english-app4.html?v=20260827-direct1" title="Mykyu System Personal Fortune" loading="eager"></iframe><script>(function(){const app=document.getElementById('app');const animals={Zi:'Rat',Chou:'Ox',Yin:'Tiger',Mao:'Rabbit',Chen:'Dragon',Si:'Snake',Wu:'Horse',Wei:'Goat',Shen:'Monkey',You:'Rooster',Xu:'Dog',Hai:'Pig'};const cycleRe=/\b(?:Jia|Yi|Bing|Ding|Wu|Ji|Geng|Xin|Ren|Gui)-(Zi|Chou|Yin|Mao|Chen|Si|Wu|Wei|Shen|You|Xu|Hai)\b/gi;function animal(v){return String(v??'').replace(cycleRe,(_,b)=>animals[b]||b)}function fix(){try{const d=app.contentDocument;if(!d||!d.body)return;const meta=d.getElementById('meta');if(meta){meta.textContent=meta.textContent.replace(/Year cycle\s+([A-Za-z]+-[A-Za-z]+)/i,(_,v)=>'Year Zodiac '+animal(v));}for(const id of ['personalTable','calcinfo']){const t=d.getElementById(id);if(!t)continue;for(const tr of t.querySelectorAll('tr')){const cells=tr.querySelectorAll('td');if(cells.length<2)continue;let label=cells[0].textContent.trim(),value=cells[1].textContent.trim();if(/^Year cycle$/i.test(label)){cells[0].textContent='Year Zodiac';cells[1].textContent=animal(value);}else if(/^Month cycle$/i.test(label)){cells[0].textContent='Month Zodiac';cells[1].textContent=animal(value);}else if(/^Birth-day cycle$/i.test(label)){cells[0].textContent='Birth-day Zodiac';cells[1].textContent=animal(value);}else{const nv=animal(value);if(nv!==value)cells[1].textContent=nv;}if(/^Gua code$/i.test(label))cells[0].textContent='Reading Code';if(/^Upper Gua$/i.test(label))cells[0].textContent='Upper Trigram';if(/^Middle Gua$/i.test(label))cells[0].textContent='Middle Trigram';if(/^Lower Gua$/i.test(label))cells[0].textContent='Lower Trigram';if(/^Final 144 Gua$/i.test(label))cells[0].textContent='Final Reading';}}const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);for(const node of nodes){if(!node.parentElement||['SCRIPT','STYLE','TEXTAREA'].includes(node.parentElement.tagName))continue;let s=node.nodeValue,out=animal(s);out=out.replace(/\bGua code\b/gi,'Reading Code').replace(/\bUpper Gua\b/gi,'Upper Trigram').replace(/\bMiddle Gua\b/gi,'Middle Trigram').replace(/\bLower Gua\b/gi,'Lower Trigram').replace(/\bFinal 144 Gua\b/gi,'Final Reading');if(out!==s)node.nodeValue=out;}}catch(e){}}app.addEventListener('load',()=>{fix();const d=app.contentDocument;if(d&&d.body){new MutationObserver(fix).observe(d.body,{subtree:true,childList:true,characterData:true});}setTimeout(fix,200);setTimeout(fix,800);setTimeout(fix,1800)});setInterval(fix,500);})();</script></body></html>
